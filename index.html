  async hintergrundStart(anzahl){
    const c=Store.cfg();
    const basis=this.engineBasis();
    if(!basis) return this.toast('Im Setup die Hintergrund-Worker-URL eintragen.',1);
    if(!c.pass) return this.toast('Zugangswort im Setup fehlt.',1);
    const p=this.p;
    const start=Pipe.naechstesN(p);
    const plan=[];
    for(let n=start;n<start+anzahl && n<=p.toc.length;n++){
      const t=p.toc.find(x=>x.n===n)||{titel:'Kapitel '+n,beat:''};
      plan.push({n,titel:t.titel,beat:t.beat||''});
    }
    if(!plan.length) return this.toast('Kein offenes Kapitel mehr.',1);
    const ctx=Pipe.ctxFor(p,plan[0].n);
    const jobId='p-'+p.id+'-'+Date.now().toString(36);
    try{
      this.toast('Hintergrundauftrag startet …');
      const r=await fetch(basis+'/start',{method:'POST',headers:{'content-type':'application/json','x-sw-pass':c.pass},body:JSON.stringify({
        jobId, typ:'lauf', model:c.model||'kimi-k2.6', apiKey:c.key, plan,
        projekt:{
          id:p.id, system:p.system, konzept:p.konzept, toc:p.toc, outline:p.outline||{},
          state:p.state, bibel:p.bibel, kapitelZiel:p.kapitelZiel||2200, blacklist:p.blacklist
        }
      })});
      const d=await r.json();
      if(!r.ok) throw new Error(d.fehler||r.status);
      p.state.hintergrundJob=d.jobId||jobId;
      this.save();
      this.toast('Läuft auf dem Server. Handy darf aus.');
      this.render();
    }catch(e){ this.toast('Hintergrund: '+e.message,1); }
  },
  async hintergrundSync(){
    const c=Store.cfg(); const basis=this.engineBasis(); const p=this.p;
    if(!basis || !p || !p.state.hintergrundJob) return;
    try{
      const r=await fetch(basis+'/status?jobId='+encodeURIComponent(p.state.hintergrundJob),{headers:{'x-sw-pass':c.pass||''}});
      const d=await r.json();
      if(!r.ok) return;
      let neu=0;
      (d.kapitel||[]).forEach(k=>{
        if(k.text && !Store.kapitel(p.id,k.n)){
          Store.saveKapitel(p.id,k.n,{n:k.n,titel:k.titel,body:k.text,woerter:k.woerter||words(k.text),stand:k.stand||'ok'});
          if(!p.kapitelIdx.find(x=>x.n===k.n)) p.kapitelIdx.push({n:k.n,titel:k.titel,woerter:k.woerter||words(k.text)});
          neu++;
        }
      });
      if(d.state){
        p.state = d.state;
        p.state.woerter_gesamt = p.kapitelIdx.reduce((a,x)=>a+(x.woerter||0),0);
      }
      if(neu){ p.kapitelIdx.sort((a,b)=>a.n-b.n); this.save(); }
      if(d.status==='fertig'||d.status==='fehler'||d.status==='stopp'){
        this.toast(neu? (neu+' Kapitel vom Server geholt') : ('Hintergrund: '+d.status));
        if(d.status!=='laeuft' && d.status!=='wartet') p.state.hintergrundJob=null;
        this.save();
      } else if(neu) this.toast(neu+' Kapitel nachgeladen');
      this.render();
    }catch(e){}
  },

      const body=c.body.split(/\n{2,}|\n/).map(s=>s.trim()).filter(Boolean)
        .map(s=> (s==='*'||s==='***') ? '<p class="sep">* * *</p>' : '<p>'+esc(s)+'</p>').join('');
      o.file(id+'.xhtml',`<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><head><title>${esc(c.titel)}</title><link rel="stylesheet" type="text/css" href="style.css"/></head><body><section epub:type="chapter"><div class="kap">${c.n===0?'Prolog':'Kapitel '+c.n}</div><h1>${esc(c.titel)}</h1>${body}</section></body></html>`);
      man+=`<item id="${id}" href="${id}.xhtml" media-type="application/xhtml+xml"/>`;
      spine+=`<itemref idref="${id}"/>`;
      toc+=`<li><a href="${id}.xhtml">${esc(c.titel)}</a></li>`;
      ncx+=`<navPoint id="${id}" playOrder="${po++}"><navLabel><text>${esc(c.titel)}</text></navLabel><content src="${id}.xhtml"/></navPoint>`;
    });
    const bid='urn:uuid:sw-'+p.id+'-'+Date.now();
    o.file('content.opf',`<?xml version="1.0" encoding="UTF-8"?><package version="3.0" xmlns="http://www.idpf.org/2007/opf" unique-identifier="BookId"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>${esc(p.konzept.titel)}</dc:title><dc:creator>${esc(p.autor||'Unbekannt')}</dc:creator><dc:language>de</dc:language><dc:identifier id="BookId">${bid}</dc:identifier>${p.isbn?'<dc:identifier>'+esc(p.isbn)+'</dc:identifier>':''}<dc:date>${new Date().toISOString().slice(0,10)}</dc:date><meta property="dcterms:modified">${new Date().toISOString().replace(/\.\d+/,'')}</meta>${coverMeta}</metadata><manifest>${man}<item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/></manifest><spine toc="ncx"><itemref idref="nav" linear="no"/>${spine}</spine></package>`);
    o.file('nav.xhtml',`<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><head><title>Inhalt</title><link rel="stylesheet" type="text/css" href="style.css"/></head><body><nav epub:type="toc" id="toc"><h1>Inhalt</h1><ol>${toc}</ol></nav></body></html>`);
    o.file('toc.ncx',`<?xml version="1.0" encoding="UTF-8"?><ncx version="2005-1" xmlns="http://www.daisy.org/z3986/2005/ncx/"><head><meta name="dtb:uid" content="${bid}"/><meta name="dtb:depth" content="1"/><meta name="dtb:totalPageCount" content="0"/><meta name="dtb:maxPageNumber" content="0"/></head><docTitle><text>${esc(p.konzept.titel)}</text></docTitle><navMap>${ncx}</navMap></ncx>`);
    this.dl(await zip.generateAsync({type:'blob',mimeType:'application/epub+zip'}), this.datei('epub'));
    this.toast('EPUB 3 exportiert');
  },

  async exportDOCX(){
    const chs=this.alleKapitel(); if(!chs.length) return this.toast('Noch keine Kapitel.',1);
    const p=this.p, zip=new JSZip();
    const t=s=>esc(s).replace(/\t/g,' ');
    let body='';
    chs.forEach((c,i)=>{
      if(i) body+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
      body+=`<w:p><w:pPr><w:pStyle w:val="Heading1"/></w:pPr><w:r><w:t xml:space="preserve">${c.n===0?'Prolog':'Kapitel '+c.n} — ${t(c.titel)}</w:t></w:r></w:p>`;
      c.body.split(/\n{2,}|\n/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
        const mitte=(s==='*'||s==='***');
        body+=`<w:p>${mitte?'<w:pPr><w:jc w:val="center"/></w:pPr>':''}<w:r><w:t xml:space="preserve">${mitte?'* * *':t(s)}</w:t></w:r></w:p>`;
      });
    });
    zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
    zip.folder('_rels').file('.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
    const w=zip.folder('word');
    w.folder('_rels').file('document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
    w.file('styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Georgia" w:hAnsi="Georgia"/><w:sz w:val="24"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="300" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:pPr><w:outlineLvl w:val="0"/><w:spacing w:before="480" w:after="240"/></w:pPr><w:rPr><w:b/><w:sz w:val="32"/></w:rPr></w:style></w:styles>');
    w.file('document.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417"/></w:sectPr></w:body></w:document>`);
    this.dl(await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}), this.datei('docx'));
    this.toast('Word-Datei exportiert');
  }
});



/* ============ HINTERGRUND: Wake-Lock, Auto-Resume, Benachrichtigung ============ */
const Hintergrund = {
  lock: null,
  resumePending: false,
  async wachhalten(){
    try{
      if(document.visibilityState!=='visible') return;
      if(this.lock) return;
      if(navigator.wakeLock && navigator.wakeLock.request){
        this.lock = await navigator.wakeLock.request('screen');
        this.lock.addEventListener('release', ()=>{ this.lock=null; });
      }
    }catch(e){ this.lock=null; }
  },
  loslassen(){
    try{ this.lock && this.lock.release(); }catch(e){}
    this.lock=null;
  },
  async benachrichtigen(titel, text){
    try{
      if(!('Notification' in window)) return;
      if(Notification.permission==='default') await Notification.requestPermission();
      if(Notification.permission==='granted'){
        const n = new Notification(titel||'Roman-Werkstatt', {body:text||'', icon:'icon.svg', tag:'rw-kapitel'});
        n.onclick = ()=>{ window.focus(); n.close(); };
      }
    }catch(e){}
  }
};
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible'){
    if(typeof Pipe!=='undefined' && Pipe.laeuft) Hintergrund.wachhalten();
    // Pipeline nach kurzem Wegschalten fortsetzen, wenn sie stehengeblieben ist
    if(typeof App!=='undefined' && App.p && typeof Pipe!=='undefined' && !Pipe.laeuft){
      try{
        const id = App.p.id;
        const offene = (App.p.kapitelIdx||[]).filter(k=>{
          const z = Store.zwischenstand(id, k.n);
          return z && !z.fertig;
        });
        if(offene.length && App._autoResume!==false){
          const n = offene[0].n;
          App.toast && App.toast('Hintergrund: Kapitel '+n+' wird fortgesetzt');
          if(Pipe.kapitel) Pipe.kapitel(App.p, n).then(()=>{ Hintergrund.benachrichtigen('Kapitel fertig','Kapitel '+n+' ist geschrieben.'); App.render && App.render(); }).catch(e=>App.toast && App.toast(String(e.message||e),1));
        }
      }catch(e){}
    }
  }else{
    // Zwischenstand sichern, bevor iOS die Seite einfriert
    try{
      if(typeof Pipe!=='undefined' && Pipe.laeuft && App && App.p && App._offenesKapitel){
        const n = App._offenesKapitel;
        const z = Store.zwischenstand(App.p.id, n) || {};
        z.ts = Date.now(); z.paused=true;
        Store.saveZwischenstand(App.p.id, n, z);
      }
    }catch(e){}
  }
});
window.addEventListener('pagehide', ()=>{
  try{
    if(App && App.p) Store.save(App.p);
  }catch(e){}
});

/* ============ PWA + COVER ============ */
Object.assign(App, {
  setupPWA(){
    const icon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='30' fill='%230E1216'/%3E%3Crect x='52' y='34' width='88' height='124' rx='44' fill='none' stroke='%234A9EFF' stroke-width='5'/%3E%3Cpath d='M70 60 C70 128 96 150 96 150' stroke='%23C9D1D7' stroke-width='4' fill='none' opacity='.55'/%3E%3Ccircle cx='96' cy='96' r='7' fill='%234A9EFF'/%3E%3C/svg%3E";
    const manifest = {
      name:'Roman-Werkstatt', short_name:'Roman-Werkstatt', start_url:'.', display:'standalone',
      orientation:'portrait', background_color:'#0E1216', theme_color:'#0E1216',
      icons:[{src:icon, sizes:'192x192', type:'image/svg+xml'},{src:icon, sizes:'512x512', type:'image/svg+xml'}]
    };
    try{
      const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));
      const m=document.getElementById('manifestLink'); if(m) m.href=url;
      const a=document.getElementById('appleIcon'); if(a) a.href=icon;
    }catch(e){}
    // Cache-Bust: neue SW-Version loescht alte kaputte Offline-Kopien
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js?v=6',{updateViaCache:'none'}).then(reg=>{
        try{ reg.update(); }catch(e){}
      }).catch(()=>{});
    }
  },

  coverWaehlen(ev){
    const f=ev.target.files && ev.target.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)) return this.toast('Das ist kein Bild.',1);
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const maxH=1400, sk=Math.min(1, maxH/img.height);
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*sk); c.height=Math.round(img.height*sk);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const data=c.toDataURL('image/jpeg',0.82);
        if(data.length > 1_200_000) return this.toast('Bild zu groß für den Speicher — kleiner exportieren.',1);
        this.p.cover=data; this.save(); this.render();
        const v=img.width/img.height;
        if(Math.abs(v-0.625)>0.06) this.toast('Gespeichert. KDP mag 1600×2560 (Seitenverhältnis 1:1,6).');
        else this.toast('Cover gespeichert');
      };
      img.onerror=()=>this.toast('Bild ließ sich nicht laden.',1);
      img.src=r.result;
    };
    r.readAsDataURL(f);
  },

  coverWeg(){ if(!confirm('Cover entfernen?')) return; this.p.cover=null; this.save(); this.render(); }
});


App.cloudLaden = async function(){
  try{
    const r = await CloudSync.pullAll();
    const id = Store.aktivId();
    this.p = id ? Store.load(id) : this.p;
    this.toast(CloudSync.lastMsg || 'Cloud geladen');
    this.render();
  }catch(e){ this.toast('Cloud laden: '+(e.message||e), 1); }
};
App.cloudSpeichern = async function(){
  try{
    await CloudSync.pushAktiv();
    this.toast(CloudSync.lastMsg || 'In Cloud gespeichert');
    this.render();
  }catch(e){ this.toast('Cloud speichern: '+(e.message||e), 1); }
};
App.cloudStatus = async function(){
  try{
    const liste = await CloudSync.liste();

    const zeilen = liste.map(p => (p.name||p.id)+' · K'+(p.aktuelles_kapitel||0)+' · '+(p.woerter_gesamt||0)+' W.').join('\n');
    alert('Gemeinsamer Speicher:\n\n'+zeilen);
  }catch(e){ this.toast('Cloud-Status: '+(e.message||e), 1); }
};

App.setupPWA();
App.init();
