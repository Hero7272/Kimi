<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>Roman-Werkstatt</title>
<style>
body{font-family:-apple-system,sans-serif;background:#F5F5F7;color:#1D1D1F;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{text-align:center;padding:24px}
.sp{width:28px;height:28px;border:3px solid #E5E5EA;border-top-color:#FF9500;border-radius:50%;animation:s .7s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="sp"></div><div>Roman-Werkstatt lädt …</div></div>
<script>
(async function(){
  try {
    const parts = [];
    for (let i = 0; i < 11; i++) {
      const r = await fetch('h.' + i + '.txt');
      if (!r.ok) throw new Error('Teil ' + i + ' fehlt (' + r.status + ')');
      parts.push(await r.text());
    }
    const b64 = parts.join('');
    const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bin]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.body.innerHTML = '<div class="box"><h2>Ladefehler</h2><p>' + e.message + '</p><p style="color:#8E8E93;font-size:14px">Hard-Refresh (Ctrl+Shift+R).</p></div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
