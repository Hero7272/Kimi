*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{

}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header{
  position:sticky;top:0;z-index:40;background:rgba(245,245,247,.82);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(0,0,0,.06);
  padding:calc(12px + env(safe-area-inset-top)) 0 12px;
}
header .wrap{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
h1{font-family:var(--sans);font-size:22px;font-weight:700;color:var(--head);margin:0;letter-spacing:-0.03em}
h1 .ds{color:var(--deep);font-weight:700}
.proj{font-size:13px;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
h2{font-family:var(--sans);font-size:20px;font-weight:700;color:var(--head);margin:0 0 10px;letter-spacing:-0.02em}

p{margin:0 0 10px}
a{color:var(--deep);text-decoration:none;font-weight:500}

}

.row>*{flex:1;min-width:0}

.uhr .track>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#FFD60A,var(--deep));border-radius:9px}
.uhr .track>b{position:absolute;top:0;bottom:0;width:2px;background:var(--deep-dark)}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid rgba(0,0,0,.06);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -4px 24px rgba(0,0,0,.04)

nav .wrap{display:flex}
nav button{

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:99;
  background:rgba(28,28,30,.92);backdrop-filter:blur(12px);color:#fff;

.toast.bad{background:rgba(255,59,48,.95)}
.reader{font-family:var(--serif);font-size:19px;line-height:1.7;color:var(--head);letter-spacing:0}
.reader p{margin:0 0 1.1em;text-align:left}
.reader .sep{text-align:center;color:var(--muted);margin:1.6em 0;letter-spacing:.5em}
.kap{font-family:var(--sans);color:var(--muted);font-size:13px;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.empty{

details{border:none;border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--panel);box-shadow:var(--shadow)}
summary{cursor:pointer;color:var(--head);font-size:15px;font-weight:600}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px}
hr{border:none;border-top:1px solid var(--line);margin:18px 0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{

.tile small{display:block;font-weight:500;color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:0}
.tile.accent{background:rgba(255,149,0,.14);color:var(--deep)}
.row.pack>*{flex:0 1 auto;min-width:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

praemisse: "Paul Anders, 24, Rettungssanitäter, stirbt bei einem Einsatz, den er eigentlich hätte überleben müssen — und wacht in Karvenholt auf, einer Welt, in der jeder Mensch eine innere 'Kernglut' trägt, die sich zu individuellen Techniken formen lässt. Er hat keine Ahnung, keine Kernglut-Kategorie, keinen Platz — nur die Erinnerung an einen Patienten, den er nicht retten konnte, und das Gefühl, hier zum zweiten Mal eine Chance zu bekommen, die er sich nicht verdient hat. Um zu überleben und herauszufinden, warum ausgerechnet er hier gelandet ist, muss er den gefährlichen Wanderpass bestehen — eine mehrstufige Prüfung, die aus Fremden offizielle Grenzgänger macht, mit Zugang zu den unerschlossenen Zonen zwischen den Städten.",
kern: "Der Standard-Isekai ist: Ein Niemand bekommt plötzlich Superkräfte und wird zum Helden. Hier ist es: Paul bekommt keine Kraft geschenkt, sondern muss sich seine Kernglut-Technik aus dem bauen, was er tatsächlich kann — als Sanitäter kennt er Körper, Verletzungen, Belastungsgrenzen, nicht Kampf. Sein Vorteil ist kein Kampf-Talent, sondern dass er weiß, wie man am Leben bleibt und andere am Leben hält, wenn alles schiefgeht. Die Spannung ist nicht 'wird er stark genug', sondern 'was ist er bereit zu riskieren, und an wem übt er es zuerst?'",
regeln: [
"Jeder Mensch trägt Kernglut — eine innere Reserve, die sich erst zeigt, wenn sie unter echtem Druck (Todesangst, Erschöpfung, Verlust) das erste Mal durchbricht. Vorher ist sie unsichtbar, auch für Eingeweihte.",

figuren: [

schauplatz: "Karvenholt, eine befestigte Grenzstadt am Rand der kartierten Welt, gebaut auf und um die Ruinen einer viel älteren Zivilisation. Dahinter liegen die unerschlossenen Zonen — Wald-, Sumpf- und Ruinenlandschaften, in denen die Kernglut anderer, nicht-menschlicher Wesen aktiv ist. Die Stadt ist geteilt in die befestigte Kernstadt (Handel, Wächter-Kammer, Prüfungshallen) und die ärmeren Außenringe, wo Familien wie die Vorgrimms leben. Jahreszeit: Spätherbst, kurz vor der nächsten Mondwende.",

const SYSTEM_BASIS = `Du bist ein erfahrener Ghostwriter für diesen deutschen Roman in Buchlänge —
und du schreibst wie ein mehrfach ausgezeichneter, vielgelesener Autor deines
Genres: ökonomisch, bildstark, mit einem sicheren Ohr für Rhythmus. Dein
Handwerk: körperliche Präzision, verzögerte Information, Figuren, die
falsche Entscheidungen aus nachvollziehbaren Gründen treffen. Du schreibst
Prosa, die aussieht, als hätte sie ein Mensch geschrieben, der schon drei
Bücher veröffentlicht hat und keine Angst mehr vor schlichten Sätzen hat.

Du denkst in Systemen, in Regeln, in klaren Grenzen. Genau das macht dich zu einem hervorragenden
Ghostwriter für Geschichten, in denen die Weltregeln den Preis jeder
Handlung bestimmen. Du liebst es, wenn der Leser den Preis einer Regel
früher begreift als die Hauptfigur — und dann zusehen muss, wie sie ihn bezahlt.

ERZÄHLHALTUNG
- Personale Perspektive, dritte Person, Vergangenheit, ausschließlich die Hauptfigur.
- Keine Kapitelzusammenfassungen am Anfang. Steig mitten in einer Handlung ein.
- Der Leser erfährt nie mehr als die Hauptfigur. Nie.

HANDWERKSREGELN
1. Zeigen statt erklären: nach einer sichtbaren Reaktion NICHT die Emotion benennen.
2. Ein Sinneseindruck pro Absatz reicht, aber er muss spezifisch sein:
   nicht "es roch komisch", sondern "es roch nach nassem Zement und Essig".
3. Satzrhythmus muss unregelmäßig sein. Mische Sätze von 3 bis 35 Wörtern.
   Wenn drei Sätze hintereinander gleich lang sind, schreib sie um.
4. Dialog: Menschen antworten aneinander vorbei, unterbrechen sich, sagen
   Belangloses. Nur "sagte" und "fragte" als Inquit. Keine Adverbien daran.
   Kein Charakter erklärt einem anderen vollständig etwas, das der andere
   plausibel schon wissen müsste — Exposition kommt bruchstückhaft, nie als Vortrag.
5. Absatzlängen variieren. Ein Ein-Wort-Absatz ist erlaubt — maximal einmal
   pro drei Kapitel.
6. KEINE WÖRTLICHEN WIEDERHOLUNGEN: Eine Geste, ein Satzbaustein, eine
   Redewendung, die eine Figur oder der Erzähler in einem früheren Kapitel
   schon benutzt hat, wird nicht wortgleich oder fast wortgleich wiederholt.
   Wiederkehrende Motive sind erlaubt und erwünscht — aber sie müssen bei
   jedem Auftauchen eine andere Formulierung, einen anderen Blickwinkel oder
   eine veränderte Bedeutung bekommen. Ein Tic, den eine Figur einmal hat,
   ist Charakterisierung; derselbe Tic zehnmal ist ein Verrat, dass hier
   kein Mensch mit Gedächtnis schreibt.
7. Vor dem Schreiben: Prüfe die Liste "BEREITS VERWENDETE BILDER" im Auftrag.
   Nichts davon wortgleich oder sinngemäß wiederverwenden.

HANDWERK
- Du denkst in if-then-Strukturen. Jede Szene hat eine Bedingung und eine Konsequenz.
- Deine Sätze sind klar, aber nicht steril. Du erlaubst dir poetische Momente — sparsam.
- Du hast ein Gespür für das, was nicht gesagt wird. Die Lücken zwischen den Sätzen sind dein Material.
- Du schreibst keine ausufernden Beschreibungen. Drei präzise Details reichen.

COPYRIGHT
Verwende keine Namen, Figuren, Orte, Objekte, Dialoge oder Szenenfolgen aus
existierenden Filmen, Büchern oder Spielen. Keine Zitate, keine Songtexte,
keine Gedichte. Alles Erfundene muss erfunden sein.`;

/* ============ SPEICHER ============ */
/* ============ SPEICHER: IndexedDB mit synchronem In-Memory-Cache ============
   Warum: localStorage deckelt bei ~5MB pro Origin — für ein 90.000-Wörter-Buch
   mit Entwürfen, Audit-JSON und History realistisch knapp. IndexedDB hat ein
   Vielfaches an Platz (praxisnah oft hunderte MB bis GB, browserabhängig).
   Damit nicht jede der ~40 Aufrufstellen im Code auf async umgestellt werden
   muss, bleibt die S.get/S.put/S.del-Schnittstelle synchron: sie liest/schreibt
   sofort einen In-Memory-Cache (MEM), der bei App-Start einmal aus IndexedDB
   befüllt wird (inkl. einmaliger Migration aus altem localStorage, damit
   bestehende Bücher nicht verloren gehen) und danach im Hintergrund bei jedem
   Schreibzugriff asynchron nach IndexedDB gespiegelt wird. */
const IDB = {
  db: null, DBNAME:'silberwerk-db', STORE:'kv', bereit: null,
  oeffnen(){
    if(this.bereit) return this.bereit;
    this.bereit = new Promise((resolve)=>{
      if(!window.indexedDB){ resolve(false); return; }
      let req;
      try{ req = indexedDB.open(this.DBNAME, 1); }catch(e){ resolve(false); return; }
      req.onupgradeneeded = ()=>{ try{ req.result.createObjectStore(this.STORE); }catch(e){} };
      req.onsuccess = ()=>{ this.db = req.result; resolve(true); };
      req.onerror = ()=>{ resolve(false); };
    });
    return this.bereit;
  },
  async alle(){
    const ok = await this.oeffnen();
    if(!ok || !this.db) return {};
    return new Promise((resolve)=>{
      try{
        const tx = this.db.transaction(this.STORE, 'readonly'), st = tx.objectStore(this.STORE);
        const out = {}; const req = st.openCursor();
        req.onsuccess = ()=>{ const c = req.result; if(c){ out[c.key] = c.value; c.continue(); } else resolve(out); };
        req.onerror = ()=>resolve(out);
      }catch(e){ resolve({}); }
    });
  },
  async setzen(k, v){
    const ok = await this.oeffnen();
    if(!ok || !this.db) throw new Error('IndexedDB nicht verfügbar');
    return new Promise((resolve, reject)=>{
      try{
        const tx = this.db.transaction(this.STORE, 'readwrite');
        tx.objectStore(this.STORE).put(v, k);
        tx.oncomplete = ()=>resolve(true);
        tx.onerror = ()=>reject(tx.error||new Error('IndexedDB-Schreibfehler'));
      }catch(e){ reject(e); }
    });
  },
  async loeschen(k){
    const ok = await this.oeffnen();
    if(!ok || !this.db) return;
    return new Promise((resolve)=>{
      try{
        const tx = this.db.transaction(this.STORE, 'readwrite');
        tx.objectStore(this.STORE).delete(k);
        tx.oncomplete = ()=>resolve(); tx.onerror = ()=>resolve();
      }catch(e){ resolve(); }
    });
  }
};

const MEM = {};
let MEM_BEREIT = false;

const S = {
  KM:'sw:meta', pk:id=>'sw:proj:'+id, ck:(id,n)=>'sw:ch:'+id+':'+n,
  ok(){ return MEM_BEREIT || (()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})(); },
  get(k,f){ return (k in MEM) ? MEM[k] : f; },
  put(k,v){
    MEM[k] = v;
    IDB.setzen(k, v).catch(e=>{
      if(typeof App!=='undefined' && App.toast) App.toast('Konnte nicht dauerhaft speichern (Speicher voll?): '+e.message, 1);
    });
    return true;
  },
  del(k){ delete MEM[k]; IDB.loeschen(k).catch(()=>{}); },
  // Einmalig beim Start: IndexedDB in den Cache laden; ist IndexedDB leer,
  // aber alte Daten liegen noch in localStorage (Version vor dem IDB-Umzug),
  // werden sie automatisch übernommen, damit kein Buch verloren geht.
  async initialisieren(){
    let daten = {};
    try{ daten = await IDB.alle(); }catch(e){ daten = {}; }
    const hatIdbDaten = Object.keys(daten).some(k=>k.startsWith('sw:'));
    if(!hatIdbDaten){
      // Migration aus localStorage (alte Version dieser App)
      try{
        for(const k in localStorage){
          if(!k.startsWith('sw:')) continue;
          try{ daten[k] = JSON.parse(localStorage.getItem(k)); }catch(e){}
        }
        for(const k in daten){ await IDB.setzen(k, daten[k]).catch(()=>{}); }
      }catch(e){}
    }
    Object.assign(MEM, daten);
    MEM_BEREIT = true;
  }
};

const Store = {
  meta(){ return S.get(S.KM, {liste:[], aktiv:null}); },
  saveMeta(m){ S.put(S.KM, m); },
  list(){ return this.meta().liste; },
  aktivId(){ const m=this.meta(); return m.aktiv || (m.liste[0] && m.liste[0].id) || null; },
  load(id){ return S.get(S.pk(id), null); },
  save(p){ S.put(S.pk(p.id), p); const m=this.meta(); const e=m.liste.find(x=>x.id===p.id);
    if(e){ e.name=p.name } else { m.liste.push({id:p.id,name:p.name}); }
    m.aktiv=p.id; this.saveMeta(m); },
  create(vorlage){ const p=neuesProjekt(vorlage); this.save(p); return p; },
  remove(id){ const p=this.load(id); if(p) p.kapitelIdx.forEach(k=>S.del(S.ck(id,k.n)));
    S.del(S.pk(id)); const m=this.meta(); m.liste=m.liste.filter(x=>x.id!==id);
    if(m.aktiv===id) m.aktiv = m.liste[0]?m.liste[0].id:null; this.saveMeta(m); },
  kapitel(id,n){ return S.get(S.ck(id,n), null); },
  saveKapitel(id,n,obj){ S.put(S.ck(id,n), obj); },

/* ============ CLOUD-SYNC (gemeinsamer Speicher am buch-engine Worker) ============ */
const CloudSync = {
  timer: null,
  lastMsg: '',
  enabled(){
    const c = Store.cfg();
    return !!(String(c.engineUrl||'').trim() && String(c.pass||'').replace(/[\s\u00A0]/g,''));
  },
  base(){ return String(Store.cfg().engineUrl||'').trim().replace(/\/$/,''); },
  headers(extra){
    const h = {
      'content-type': 'application/json',
      'Accept': 'application/json',
      'User-Agent': 'Mozilla/5.0 Roman-Werkstatt'
    };
    const pw = String(Store.cfg().pass||'').replace(/[\s\u00A0]/g,'');
    if(pw) h['x-sw-pass'] = pw;
    return Object.assign(h, extra||{});
  },
  async req(method, path, body, extraHeaders){
    if(!this.enabled()) throw new Error('Cloud-Sync nicht konfiguriert (Hintergrund-Worker + Zugangswort)');
    const opt = { method, headers: this.headers(extraHeaders) };
    if(body !== undefined) opt.body = JSON.stringify(body);
    const r = await fetch(this.base()+path, opt);
    const txt = await r.text();
    let data = null;
    try{ data = txt ? JSON.parse(txt) : null; }catch(e){ data = { roh: txt }; }
    if(!r.ok){
      const msg = (data && (data.fehler || data.error)) || ('HTTP '+r.status);
      const err = new Error(msg);
      err.status = r.status; err.data = data;
      throw err;
    }
    return data;
  },
  queuePush(){
    if(this.pulling) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(()=>{ this.pushAktiv().catch(()=>{}); }, 900);
  },
  async pushAktiv(){
    if(!this.enabled() || !App || !App.p) return;
    const p = App.p;
    try{
      const res = await this.req('PUT', '/projekt', p, p.aktualisiert ? { 'If-Match': String(p.aktualisiert) } : undefined);
      if(res && res.aktualisiert) p.aktualisiert = res.aktualisiert;
      // Projekt ohne Kapiteltexte lokal speichern bleibt; Kapitel separat pushen
      for(const k of (p.kapitelIdx||[])){
        const ch = Store.kapitel(p.id, k.n);
        if(!ch) continue;
        const body = Object.assign({}, ch, { id: p.id, n: k.n });
        const cr = await this.req('PUT', '/kapitel', body, ch.aktualisiert ? { 'If-Match': String(ch.aktualisiert) } : undefined);
        if(cr && cr.aktualisiert){ ch.aktualisiert = cr.aktualisiert; Store.saveKapitel(p.id, k.n, ch); }
      }
      this.lastMsg = 'Cloud synchronisiert · '+new Date().toLocaleTimeString('de-DE');
      S.put(S.pk(p.id), p); // aktualisiert lokal merken
    }catch(e){
      if(e.status === 409 && e.data && e.data.serverAktualisiert){
        this.lastMsg = 'Konflikt — Server neuer. Tippe „Cloud laden“.';
        if(App.toast) App.toast('Cloud-Konflikt: Server hat neuere Version. „Cloud laden“ nutzen.', 1);
      } else {
        this.lastMsg = 'Sync-Fehler: '+(e.message||e);
        if(App.toast) App.toast('Cloud-Sync: '+(e.message||e), 1);
      }
    }
  },
  async pullProjekt(id){
    const data = await this.req('GET', '/projekt?id='+encodeURIComponent(id));
    const projekt = data.projekt || data;
    if(!projekt || !projekt.id) throw new Error('Projekt leer');
    // Kapitel nachziehen
    for(const k of (projekt.kapitelIdx||[])){
      try{
        const ch = await this.req('GET', '/kapitel?id='+encodeURIComponent(id)+'&n='+k.n);
        const kapitel = ch.kapitel || ch;
        if(kapitel && (kapitel.text || kapitel.titel)) Store.saveKapitel(id, k.n, kapitel);
      }catch(e){ /* kapitel optional */ }
    }
    Store.save(projekt);
    return projekt;
  },
  async pullAll(){
    if(!this.enabled()) return { ok:false, grund:'aus' };
    this.pulling = true;
    try{
      const data = await this.req('GET', '/projekte');
      const liste = data.projekte || [];
      let gezogen = 0;
      for(const meta of liste){
        const lokal = Store.load(meta.id);
        const lokalTs = lokal && lokal.aktualisiert ? Date.parse(lokal.aktualisiert) : 0;
        const cloudTs = meta.aktualisiert ? Date.parse(meta.aktualisiert) : 0;
        if(!lokal || (cloudTs && cloudTs > lokalTs)){
          await this.pullProjekt(meta.id);
          gezogen++;
        }
      }
      this.lastMsg = gezogen ? (gezogen+' Projekt(e) aus der Cloud geladen') : 'Cloud aktuell';
      return { ok:true, gezogen, liste };
    } finally { this.pulling = false; }
  },
  async liste(){
    if(!this.enabled()) return [];
    const data = await this.req('GET', '/projekte');
    return data.projekte || [];
  }
};

// Store-Hooks: lokal zuerst, dann Cloud
(function wrapStore(){
  const _save = Store.save.bind(Store);
  const _remove = Store.remove.bind(Store);
  const _saveKapitel = Store.saveKapitel.bind(Store);
  const _saveZwischenstand = Store.saveZwischenstand.bind(Store);
  const _loescheZwischenstand = Store.loescheZwischenstand.bind(Store);
  Store.save = function(p){ _save(p); CloudSync.queuePush(); };
  Store.remove = function(id){
    _remove(id);
    if(CloudSync.enabled()) CloudSync.req('DELETE', '/projekt?id='+encodeURIComponent(id)).catch(e=>{ if(App.toast) App.toast('Cloud löschen: '+e.message,1); });
  };
  Store.saveKapitel = function(id,n,obj){ _saveKapitel(id,n,obj); CloudSync.queuePush(); };
  Store.saveZwischenstand = function(id,n,obj){
    _saveZwischenstand(id,n,obj);
    if(CloudSync.enabled()) CloudSync.req('PUT', '/zwischenstand', Object.assign({}, obj, {id,n})).catch(()=>{});
  };
  Store.loescheZwischenstand = function(id,n){
    _loescheZwischenstand(id,n);
    if(CloudSync.enabled()) CloudSync.req('DELETE', '/zwischenstand?id='+encodeURIComponent(id)+'&n='+n).catch(()=>{});
  };
})();

const P = {
  regelblock(p){ return p.konzept.regeln.map((r,i)=>`Regel ${i+1}: ${r}`).join('\n'); },
  regelLabel(p){ return (p.konzept.regelLabel || 'REGELWERK DES SPUKS') + ':'; },
  sonderstand(p){
    const parts=[];
    if(p.state.loeschuhr) parts.push(`LÖSCHUHR: überschrieben bis zurück ins Jahr ${p.state.loeschuhr.aktuell_geloescht_bis_jahr} (Start ${p.state.loeschuhr.startjahr}, Ende ${p.state.loeschuhr.endjahr}).`);
    if(p.state.sonderzustand) parts.push(`${p.state.sonderzustand.label||'SONDERZUSTAND'}: ${JSON.stringify((({label,...r})=>r)(p.state.sonderzustand))}`);
    return parts.join('\n');

  sonderzustandPlatzhalter(p){
    if(!p.state.sonderzustand) return 'null';
    const sz = p.state.sonderzustand, platzhalter = {};
    Object.keys(sz).forEach(k=>{
      if(k==='label') return;
      const v = sz[k];
      if(Array.isArray(v)) platzhalter[k]=[];
      else if(typeof v==='number') platzhalter[k]=0;
      else if(typeof v==='boolean') platzhalter[k]=false;
      else platzhalter[k]='';
    });

/* ============ API — ÜBER CLOUDFLARE-WORKER-PROXY ============ */
const API = {
  async call({system, user, temp=1, maxTokens=8000, onRetry, onProgress, prefill, timeoutMs=600000}){
    const cfg = Store.cfg();
    const anbieter = ANBIETER[cfg.anbieter] || ANBIETER.kimi;
    if(!cfg.key) throw new Error('Kein API-Key hinterlegt. Setup öffnen.');
    if(!cfg.proxyUrl) throw new Error('Keine Proxy-Adresse hinterlegt. Setup öffnen und die Worker-URL eintragen.');
    const sauber = String(cfg.key).replace(/[\s\u00A0\u200B-\u200D\uFEFF]/g,'');
    if(!/^[\x21-\x7E]+$/.test(sauber))
      throw new Error('Der API-Key enthält ungültige Zeichen.');
    if(sauber !== cfg.key){ const c=Store.cfg(); c.key=sauber; Store.saveCfg(c); cfg.key=sauber; }

    // Kimi-Thinking-Modelle: kimi-k3 denkt IMMER (nicht abschaltbar).
    // kimi-k2.6 kann Thinking abschalten — das spart Budget und verhindert leere content-Felder.
    // Reasoning-Tokens zählen zum max_completion_tokens-Budget mit.
    const modellKlein = String(cfg.model||'').toLowerCase();
    const istKimi = (cfg.anbieter||'kimi') === 'kimi' || modellKlein.startsWith('kimi');
    const istK3 = modellKlein.includes('kimi-k3');
    const istK27 = modellKlein.includes('kimi-k2.7');
    const istK26 = modellKlein.includes('kimi-k2.6');
    // Thinking aus: Standard bei k2.6 (cfg.thinkingOff), nicht möglich bei k3/k2.7-code
    const thinkingAus = istK26 && cfg.thinkingOff !== false && !istK3 && !istK27;
    // Budget: bei aktivem Thinking deutlich höher, sonst normal
    let effektivesBudget = maxTokens;
    if(istK3) effektivesBudget = Math.max(maxTokens, 48000);
    else if((istK26 || istK27) && !thinkingAus) effektivesBudget = Math.max(maxTokens, 24000);
    else if(istKimi) effektivesBudget = Math.max(maxTokens, 8000);
    const body = {
      model: cfg.model || anbieter.modelle[0].id,
      [anbieter.tokenFeld]: effektivesBudget,
      stream: true,
      messages: []
    };
    if(system) body.messages.push({role: 'system', content: system});
    body.messages.push({role: 'user', content: user});
    if(thinkingAus) body.thinking = {type: 'disabled'};
    // Temperatur: k3 und k2.7-code nur 1; k2.6 ohne Thinking nur 0.6; sonst gewünschte temp
    const nichtVariabel = (cfg.noTemp||[]).includes(body.model) || istK3 || istK27;
    if(nichtVariabel) body.temperature = 1;
    else if(thinkingAus) body.temperature = 0.6;
    else if(temp != null) body.temperature = temp;

    let versuch = 0;
    while(true){
      versuch++;
      let r;
      // Immer über den eigenen Cloudflare-Worker-Proxy — die meisten Anbieter blocken Direktaufrufe aus dem Browser per CORS.
      const ziel = cfg.proxyUrl.replace(/\/+$/,'');
      const kopf = {'content-type':'application/json','x-api-key':cfg.key,'x-sw-target':anbieter.basisUrl};
      const pw = String(cfg.pass||'').replace(/[\s\u00A0]/g,'');
      if(pw) kopf['x-sw-pass'] = pw;

      let abbruch=null, uhr=null;
      try{ abbruch = new AbortController(); uhr = setTimeout(()=>abbruch.abort(), timeoutMs); }catch(e){}
      const anfrage = {method:'POST', headers:kopf, body: JSON.stringify(body)};
      if(abbruch) anfrage.signal = abbruch.signal;

      try{
        r = await fetch(ziel, anfrage);
      }catch(e){
        if(uhr) clearTimeout(uhr);
        if(e.name==='AbortError') throw new Error('Zeitüberschreitung nach '+Math.round(timeoutMs/1000)+' s.');
        if(versuch < 3){
          onRetry && onRetry('Netzwerkfehler — neuer Versuch in 5 s');
          await new Promise(x=>setTimeout(x,5000));
          continue;
        }
        throw new Error('Proxy nicht erreichbar ('+ziel+'): '+e.message);
      }
      if(r.ok){
        if(uhr) clearTimeout(uhr);
        let t='', stop=null, ein=0, aus=0, abriss=null;

        if(body.stream && r.body && r.body.getReader){
          const leser = r.body.getReader(), dec = new TextDecoder();
          let puffer='', letzteMeldung=0, stillstand=null;
          const wecker = ()=>{
            if(stillstand) clearTimeout(stillstand);
            stillstand = setTimeout(()=>{ try{ leser.cancel() }catch(e){} }, 120000);
          };
          wecker();
          try{
            while(true){
              const {done, value} = await leser.read();
              if(done) break;
              wecker();
              puffer += dec.decode(value, {stream:true});
              let i;
              while((i = puffer.indexOf('\n')) >= 0){
                const zeile = puffer.slice(0,i).trim(); puffer = puffer.slice(i+1);
                if(!zeile.startsWith('data:')) continue;
                if(zeile.includes('[DONE]')) continue;
                let d; try{ d = JSON.parse(zeile.slice(5).trim()) }catch(e){ continue }
                const wahl = d.choices && d.choices[0];
                const delta = wahl && wahl.delta;
                if(delta && delta.content){
                  t += delta.content;
                  if(onProgress && Date.now()-letzteMeldung > 4000){ letzteMeldung = Date.now(); onProgress(words(t)); }
                }
                if(wahl && wahl.finish_reason) stop = wahl.finish_reason;
                if(d.usage){ ein = d.usage.prompt_tokens||0; aus = d.usage.completion_tokens||0; }
              }
            }
          }catch(e){
            abriss = e;
          }finally{
            if(stillstand) clearTimeout(stillstand);
          }
          Pipe.zaehle({input_tokens:ein, output_tokens:aus});
        } else {
          const d = await r.json();
          if(d.usage) Pipe.zaehle(d.usage);
          const msg = d.choices && d.choices[0] && d.choices[0].message;
          t = (msg && msg.content) ? msg.content : '';
          stop = d.choices && d.choices[0] && d.choices[0].finish_reason;
          if(!t && msg && msg.reasoning_content){
            // Thinking hat Budget verbraucht — content leer lassen, Retry greift
            t = '';
          }
        }

        t = t.trim();
        if(abriss && versuch < 3){
          onRetry && onRetry('Übertragung abgerissen — neuer Versuch in 5 s');
          await new Promise(x=>setTimeout(x,5000));
          continue;
        }
        if(abriss) throw new Error('Übertragung mehrfach abgerissen.');
        if(!t && versuch < 3){
          // Leere Antwort UND finish_reason "length" heißt meist: das interne
          // Nachdenken (z.B. bei kimi-k3) hat allein schon das ganze Budget
          // aufgebraucht, bevor die sichtbare Antwort anfangen konnte. Ein
          // identischer Wiederholungsversuch würde vermutlich wieder scheitern —
          // deshalb wird das Budget bei jedem Leer-Antwort-Versuch angehoben,
          // nicht nur stur wiederholt.
          const grund = stop==='length' ? ' (Antwort wurde wegen Token-Limit abgeschnitten)' : '';
          onRetry && onRetry('Leere Antwort'+grund+' — oft Thinking-Budget. Neuer Versuch mit größerem Budget (oder Thinking im Setup aus)');
          body[anbieter.tokenFeld] = Math.min(100000, Math.round((body[anbieter.tokenFeld]||effektivesBudget) * 1.6));
          await new Promise(x=>setTimeout(x,2000));
          continue;
        }
        if(!t) throw new Error('Das Modell hat nichts geliefert'+(stop?' (finish_reason: '+stop+')':'')+'.');
        return t;
      }
      if(uhr) clearTimeout(uhr);
      const txt = await r.text();
      if(r.status===403) throw new Error('Zugangswort stimmt nicht — im Setup prüfen (muss zum Worker-Secret SW_PASS passen).');
      if((r.status===429 || r.status>=500) && versuch<6){
        const wait = r.status===429 ? Math.min(60000, 5000*Math.pow(1.8, versuch-1)) : 4000*versuch;
        onRetry && onRetry(`${r.status} — neuer Versuch in ${Math.round(wait/1000)}s`);
        await new Promise(s=>setTimeout(s,wait));
        continue;
      }
      let msg = txt;
      try{ msg = JSON.parse(txt).error.message }catch(e){}
      if(r.status===401) throw new Error('API-Key ungültig — im Setup prüfen.');
      if(r.status===400){
        // Reagiert auf die tatsächliche Fehlermeldung, statt auf eine Liste
        // bekannter Modellnamen zu vertrauen (die leicht veraltet oder falsch
        // sein kann, siehe: exakter String "kimi-k3" traf nicht, obwohl das
        // Modell genau dieses Problem hatte). Die Nachricht selbst sagt, was
        // erlaubt ist — das wird direkt übernommen und für dieses Modell
        // dauerhaft gemerkt, statt bei jedem Aufruf erneut zu scheitern.
        const temperaturSperre = /temperature/i.test(msg) && /only\s+([\d.]+)\s+is allowed/i.exec(msg);
        if(temperaturSperre && versuch<3){
          const erzwungeneTemp = parseFloat(temperaturSperre[1]);
          body.temperature = erzwungeneTemp;
          try{
            const c = Store.cfg();
            if(!(c.noTemp||[]).includes(body.model)){
              c.noTemp = [...(c.noTemp||[]), body.model];
              Store.saveCfg(c);
            }
          }catch(e){}
          onRetry && onRetry(`Modell erlaubt nur Temperatur ${erzwungeneTemp} — merke mir das für „${body.model}" und versuche es erneut`);
          continue;
        }
      }
      throw new Error(`API ${r.status}: ${msg}`);
    }
  }
};

function parseJSONflex(raw, prefill){
  try{ return parseJSON(raw) }
  catch(e){
    if(prefill && String(raw).startsWith(prefill)){
      try{ return parseJSON(String(raw).slice(prefill.length)) }catch(e2){}
    }
    throw e;
  }
}

function parseJSON(raw){
  let t = String(raw||'').trim();
  t = t.replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  try{ return JSON.parse(t) }catch(e){}
  const a = t.indexOf('['), o = t.indexOf('{');
  const start = (a>-1 && (a<o || o===-1)) ? a : o;
  if(start<0){ const e=new Error('Keine JSON-Struktur in der Antwort gefunden.'); e.text=t; throw e; }
  const open = t[start], close = open==='[' ? ']' : '}';
  let d=0, ende=-1, str=false, escp=false;
  for(let i=start;i<t.length;i++){
    const c=t[i];
    if(str){ if(escp){escp=false} else if(c==='\\'){escp=true} else if(c==='"'){str=false} continue }
    if(c==='"'){str=true;continue}
    if(c===open)d++;
    else if(c===close){d--;if(d===0){ende=i;break}}
  }
  if(ende<0){ const e=new Error('JSON unvollständig — Antwort wurde vermutlich abgeschnitten.'); e.text=t; e.abgeschnitten=true; throw e; }
  return JSON.parse(t.slice(start,ende+1));
}

/* ============ PIPELINE ============ */
const Pipe = {
  laeuft:false, stop:false, logs:[], aufrufe:0, tokenEin:0, tokenAus:0,

  zaehle(u){
    this.aufrufe++;
    this.tokenEin += (u.input_tokens||0);
    this.tokenAus += (u.output_tokens||0);
    // Zusätzlich projektbezogen und dauerhaft mitschreiben (überlebt Neuladen/neue
    // Sitzung) — die Pipe-Zähler oben sind nur die aktuelle Browser-Sitzung.
    try{
      if(typeof App!=='undefined' && App.p){
        const k = App.p.state.kosten || (App.p.state.kosten = {tokenEin:0, tokenAus:0, aufrufe:0});
        k.tokenEin += (u.input_tokens||0);
        k.tokenAus += (u.output_tokens||0);
        k.aufrufe++;
      }
    }catch(e){}
  },

  fortschritt(t){
    const letzte = this.logs[this.logs.length-1];
    if(letzte && letzte.fortschritt){ letzte.t = t; App.paintLog(); }
    else { this.logs.push({t, zeit:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'}), fortschritt:true}); App.paintLog(); }
  },

  log(t,cls){ this.logs.push({t,cls,zeit:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})});
    if(this.logs.length>120) this.logs.shift(); App.paintLog(); },

  // Kurzfassung eines Kapitel-Summaries: erster Satz (oder die ersten ~160 Zeichen),
  // für Kapitel, die aus dem Volltext-Fenster herausgefallen sind.
  kurzform(s){
    const t = String(s||'').trim();
    const i = t.indexOf('. ');
    if(i>10 && i<160) return t.slice(0,i+1);
    return t.length>160 ? t.slice(0,160)+'…' : t;
  },
  ctxFor(p,n){
    const alle = (p.state.kapitel_summaries||[]).filter(s=>s.n<n).sort((a,b)=>a.n-b.n);
    const FENSTER = 14;
    const jung = alle.slice(-FENSTER);
    const alt = alle.slice(0, Math.max(0, alle.length-FENSTER));
    // Ältere Kapitel fallen nicht komplett aus dem Kontext, sondern bleiben als
    // Ein-Satz-Kurzfassung erhalten — sonst verliert das Modell ab der zweiten
    // Buchhälfte jeden Fließtext-Bezug zum ersten Drittel des Buchs.
    const altText = alt.length
      ? `FRÜHERER VERLAUF (knapp, je ein Satz — Details stehen in Fäden/Figuren/Sonderzustand):\n${alt.map(s=>`K${s.n}: ${this.kurzform(s.summary)}`).join('\n')}\n\n`
      : '';
    const jungText = jung.map(s=>`K${s.n}: ${s.summary}`).join('\n');
    let letzte400='';
    const vor = p.kapitelIdx.filter(k=>k.n<n).sort((a,b)=>b.n-a.n)[0];
    if(vor){ const ch=Store.kapitel(p.id,vor.n); if(ch) letzte400 = lastWords(ch.body,400); }
    return {summary: altText+jungText, letzte400};
  },

  async jsonCall(p, user, temp, art, maxTokens){
    const nachdruck = [
      '',
      '\n\nWICHTIG: Fasse dich knapp. Die gesamte Antwort muss vollständig in eine Ausgabe passen — lieber kürzere Texte pro Feld als eine abgeschnittene Antwort.',
      '\n\nDEINE LETZTE ANTWORT WAR UNBRAUCHBAR. Gib jetzt ausschließlich rohes JSON aus: Das erste Zeichen deiner Antwort ist [ oder {, das letzte ist ] oder }. Kein Vorwort, keine Erklärung, keine Markdown-Zäune, kein Text danach. Halte dich kurz.'
    ];
    let letzter;
    for(let i=0;i<3;i++){
      let raw='';
      try{
        raw = await API.call({system:p.system, user: user+nachdruck[i], temp: i?0.4:temp,
          maxTokens: maxTokens||16000, prefill: art, onRetry:m=>this.log(m,'e')});
        return parseJSONflex(raw, art);
      }catch(e){
        letzter = e;
        if(e.text) raw = e.text;
        if(e.abgeschnitten) this.log('Antwort lief ins Limit.','e');
        else this.log('Antwort unbrauchbar: '+e.message,'e');
        const probe = String(raw).replace(/\s+/g,' ').trim();
        if(probe) this.log('Antwort begann mit: '+probe.slice(0,160),'e');
        else this.log('Die Antwort war leer.','e');
        if(i===2) throw letzter;
        this.log('Neuer Versuch mit strengerer Anweisung …');
      }
    }
  },

  async bibel(p){
    this.log('Bibel wird erzeugt …');
    p.bibel = await this.jsonCall(p, P.bibel(p), 0.9, '{', 8000);
    Store.save(p); this.log('Bibel gespeichert.','k');
    return p.bibel;
  },

  async beats(p, von, bis){
    this.log(von===bis ? `Beats für Kapitel ${von} …` : `Beat-Sheet ${von}–${bis} wird erzeugt …`);
    const arr = await this.jsonCall(p, P.beats(p,von,bis), 0.85, '[', 4000);
    (Array.isArray(arr)?arr:[arr]).forEach(o=>{ if(typeof o.n==='number') p.outline[o.n]=o; });
    Store.save(p); this.log(`Beats stehen (${Object.keys(p.outline).length} Kapitel insgesamt).`,'k');
    return arr;
  },

  async beatsFuer(p,n){
    if(p.outline[n]) return;
    await this.beats(p, n, n);
    if(!p.outline[n]) throw new Error('Für Kapitel '+n+' kamen keine Beats zurück. Nochmal versuchen oder Modell wechseln.');
  },

  mergeState(p, n, up, text){
    const st = p.state;
    if(up.kapitel_summary){
      st.kapitel_summaries = (st.kapitel_summaries||[]).filter(s=>s.n!==n);
      st.kapitel_summaries.push({n, summary:up.kapitel_summary});
      st.kapitel_summaries.sort((a,b)=>a.n-b.n);
    }
    const geplant = ((p.outline[n]||{}).faden_neu)||[];
    [...(up.faeden_neu||[]), ...geplant].forEach(f=>{
      if(!f || !f.id) return;
      if(!st.offene_faeden.find(x=>x.id===f.id))
        st.offene_faeden.push({id:f.id, versprechen:f.versprechen||'', eroeffnet_in:n,
          spaetestens_kapitel:f.spaetestens_kapitel||n+8, status:'offen', aufgeloest_in:null});
    });
    (up.faeden_geschlossen||[]).forEach(id=>{
      const norm = String(id).trim().toLowerCase();
      const f = st.offene_faeden.find(x=>String(x.id).trim().toLowerCase()===norm);
      if(f){ f.status='geschlossen'; f.aufgeloest_in=n; }
    });
    (up.figuren_aenderungen||[]).forEach(fa=>{
      if(!fa||!fa.name) return;
      let f = st.figuren.find(x=>x.name===fa.name);
      if(!f){ f={name:fa.name, weiss:[], weiss_nicht:[], erinnerungen_geloescht:0}; st.figuren.push(f); }
      ['aufenthaltsort','koerperlicher_zustand'].forEach(k=>{ if(fa[k]) f[k]=fa[k] });
      if(typeof fa.erinnerungen_geloescht==='number' && fa.erinnerungen_geloescht>=(f.erinnerungen_geloescht||0)) f.erinnerungen_geloescht=fa.erinnerungen_geloescht;
      if(Array.isArray(fa.weiss)) f.weiss=[...new Set([...(f.weiss||[]),...fa.weiss])];
      if(Array.isArray(fa.weiss_nicht)) f.weiss_nicht=fa.weiss_nicht;
      f.letzter_auftritt_kapitel=n;
    });
    if(Array.isArray(up.neue_bilder))
      st.bereits_verwendete_bilder = [...new Set([...(st.bereits_verwendete_bilder||[]), ...up.neue_bilder])].slice(-90);
    if(typeof up.loeschuhr_neu==='number' && st.loeschuhr){
      const lo=Math.min(st.loeschuhr.startjahr, st.loeschuhr.endjahr), hi=Math.max(st.loeschuhr.startjahr, st.loeschuhr.endjahr);
      if(up.loeschuhr_neu>=lo && up.loeschuhr_neu<=hi) st.loeschuhr.aktuell_geloescht_bis_jahr = up.loeschuhr_neu;
    }
    if(up.sonderzustand_neu && typeof up.sonderzustand_neu==='object' && st.sonderzustand){
      const neu=up.sonderzustand_neu, merged={...st.sonderzustand};
      Object.keys(neu).forEach(k=>{
        if(k==='label') return;
        const nv=neu[k], av=st.sonderzustand[k];
        if(Array.isArray(nv)){
          if(nv.length) merged[k]=[...new Set([...(Array.isArray(av)?av:[]), ...nv])];
        } else if(typeof nv==='number'){
          if(nv!==0 || av===0) merged[k]=nv;
        } else if(typeof nv==='boolean'){
          merged[k]=nv;
        } else if(typeof nv==='string' && nv){
          merged[k]=nv;
        }
      });
      st.sonderzustand = merged;
    }
    const orte = up.sichere_orte_rest || ((p.outline[n]||{}).sichere_orte_rest);
    if(Array.isArray(orte)){
      const vorher = st.sichere_orte||[];
      st.sichere_orte = vorher.length ? orte.filter(o=>vorher.some(v=>v.toLowerCase().includes(o.toLowerCase())||o.toLowerCase().includes(v.toLowerCase()))) : orte;
      if(!st.sichere_orte.length && orte.length && !vorher.length) st.sichere_orte = orte;
    }
    if(typeof up.schreckmoment_bestaetigt==='boolean' ? up.schreckmoment_bestaetigt : (p.outline[n]||{}).schreckmoment) st.letzter_schreck = n;
    if(up.physische_kontinuitaet && typeof up.physische_kontinuitaet==='object'){
      const npk = up.physische_kontinuitaet, apk = st.physische_kontinuitaet||{};
      st.physische_kontinuitaet = {
        wetter: npk.wetter || apk.wetter || '',
        tageszeit_ende_kapitel: npk.tageszeit_ende_kapitel || apk.tageszeit_ende_kapitel || '',
        objekte_bei_hauptfigur: Array.isArray(npk.objekte_bei_hauptfigur) && npk.objekte_bei_hauptfigur.length
          ? npk.objekte_bei_hauptfigur : (apk.objekte_bei_hauptfigur||[])
      };
    }
    const o = p.outline[n];
    if(o && typeof o.eskalationsstufe==='number') st.eskalationsstufe = Math.max(st.eskalationsstufe, o.eskalationsstufe);
    st.aktuelles_kapitel = Math.max(st.aktuelles_kapitel, n);
    st.woerter_gesamt = p.kapitelIdx.reduce((a,k)=>a+(k.woerter||0),0);
  },

  // Token-Budget für Kapitel-Prosa-Aufrufe (Entwurf, Korrektur, Politur) — an das
  // eingestellte Wortziel gekoppelt, statt einer festen Zahl. Deutsche Wörter
  // (Komposita) brauchen mehr Tokens pro Wort als Englisch; Kimi K3 denkt intern
  // immer nach, und diese Denk-Tokens zählen mit zur Ausgabe — deshalb reichlich
  // Puffer, aber nicht grenzenlos (das Rate-Limit richtet sich nach der
  // angeforderten Zahl, nicht dem tatsächlichen Verbrauch).
  tokenBudget(p){
    return Math.max(12000, Math.round((p.kapitelZiel||2300) * 4.5) + 4000);
  },

  async kapitel(p, n, opt={}){
    const cfg = Store.cfg();
    const t = p.toc.find(x=>x.n===n) || {titel:'Kapitel '+n};
    await this.beatsFuer(p,n);
    const ctx = this.ctxFor(p,n);

    const gespeichert = Store.zwischenstand(p.id, n);
    let notizen = '', basis, text;

    if(gespeichert && gespeichert.text){
      this.log(`K${n} — gespeicherten Zwischenstand wieder aufgenommen (${nf(words(gespeichert.text))} Wörter, Runde ${gespeichert.runden||0}) — kein erneuter Entwurf nötig.`,'k');
      notizen = gespeichert.notizen || '';
      basis = P.kapitel(p,n,ctx,notizen);
      text = gespeichert.text;
    } else {
      if(!opt.ohneReflexion && cfg.reflexion!==false){
        this.log(`K${n} — Autor denkt nach …`);
        try{
          notizen = await API.call({system:'Du bist ein erfahrener Romanautor, der sich vor dem Schreiben kurz privat vorbereitet. Kein JSON, keine Liste mit Überschriften — einfach ehrliches, konkretes Nachdenken in wenigen Sätzen.',
            user:P.reflexion(p,n,ctx), temp:0.9, maxTokens:900, onRetry:m=>this.log(m,'e')});
        }catch(e){
          this.log('Autoren-Reflexion übersprungen ('+e.message+') — Kapitel wird trotzdem geschrieben.','e');
          notizen = '';
        }
      }
      basis = P.kapitel(p,n,ctx,notizen);

      this.log(`K${n} „${t.titel}" — Entwurf …`);
      try{ text = await API.call({system:p.system, user:basis, temp:0.95, maxTokens:this.tokenBudget(p), timeoutMs:900000,
        onRetry:m=>this.log(m,'e'), onProgress:w=>this.fortschritt(`K${n} — Entwurf, ${nf(w)} Wörter …`)}); }
      catch(e){ if(e.abgeschnitten){ text = e.text; this.log('Entwurf lief ins Limit — wird trotzdem geprüft.','e'); } else throw e; }
      this.log(`K${n} Entwurf: ${nf(words(text))} Wörter`);
      Store.saveZwischenstand(p.id, n, {text, runden:0, rundenFaeden:0, notizen});
    }

    let audit=null, runden=(gespeichert&&gespeichert.runden)||0, akzeptiert=false, auditUnlesbar=false, rundenFaeden=(gespeichert&&gespeichert.rundenFaeden)||0;
    const max = Math.max(0, cfg.maxRetry ?? 2);
    // Fäden-Korrektur bekommt ein GRÖSSERES eigenes Budget als allgemeine Verstöße:
    // die Prüfung ist objektiv (Zitat muss wirklich im Text stehen), nicht nur eine
    // KI-Meinung. Deshalb kann die KI hier viel öfter automatisch nachbessern, ohne
    // dass am Ende ein Mensch mitlesen und selbst beurteilen muss, ob es stimmt.
    const MAX_FAEDEN_VERSUCHE = 4;
    while(true){
      if(this.stop) throw new Error('abgebrochen');
      this.log(`K${n} — Kontinuitätsprüfung …`);
      try{
        audit = parseJSONflex(await API.call({system:'Du prüfst Kontinuität und antwortest ausschließlich mit JSON.',
          user:P.audit(p,n,text), temp:0.2, maxTokens:8000, prefill:'{', onRetry:m=>this.log(m,'e')}), '{');
      }catch(e){
        this.log('Auditor-Antwort unlesbar ('+e.message+') — Kapitel wird als „prüfen" markiert.','e');
        audit = {bestanden:false, verstoesse:[{typ:'?',schwere:'mittel',korrekturhinweis:'Auditor lieferte kein JSON'}], state_update:{}};
        auditUnlesbar = true;
        akzeptiert = false;
        break;
      }
      // Unabhängige, zitat-verifizierte Prüfung NUR für fällige Fäden — bewusst
      // getrennt vom großen Audit-Aufruf, mit einer im Code nachprüfbaren
      // Belegpflicht. Der große Auditor hat zu viele gleichzeitige Aufgaben, um
      // ausgerechnet dieser einen verlässlich nachzugehen — das hat sich wiederholt
      // gezeigt (auch in anderen Projekten). Eine enge Frage pro Aufruf plus ein
      // Zitat, das tatsächlich im Text stehen muss, ist robuster als ein weiteres
      // Pflichtfeld in einem ohnehin vollen JSON-Schema.
      const zwingendFaellig = P.faelligeFaeden(p, n, 0);
      let fadenProbleme = [];
      if(zwingendFaellig.length){
        let bestaetigteIds = [];
        try{
          const roh = await API.call({system:'Du prüfst NUR, ob bestimmte Fragen im Text beantwortet wurden. Du antwortest ausschließlich mit JSON.',
            user:P.fadenpruefung(zwingendFaellig, text), temp:0.1, maxTokens:2000, prefill:'[', onRetry:m=>this.log(m,'e')});
          const ergebnisse = parseJSONflex(roh, '[');
          const normText = String(text).replace(/\s+/g,' ');
          (Array.isArray(ergebnisse)?ergebnisse:[]).forEach(e=>{
            if(!e || !e.id || !e.aufgeloest) return;
            const beleg = String(e.beleg||'').trim().replace(/\s+/g,' ');
            // Das Zitat muss wirklich im Text vorkommen — erfundene Belege (ein
            // bekanntes Modellproblem) fallen so auf, statt einfach geglaubt zu werden.
            if(beleg.length>=8 && normText.includes(beleg)) bestaetigteIds.push(e.id);
            else this.log(`Faden ${e.id}: Auflösung behauptet, aber Zitat nicht im Text gefunden — als nicht bestätigt gewertet.`,'e');
          });
        }catch(e){
          this.log('Fäden-Prüfung fehlgeschlagen ('+e.message+') — Fäden gelten vorsichtshalber als nicht bestätigt.','e');
        }
        const norm = x => String(x).trim().toLowerCase();
        const bestaetigtSet = new Set(bestaetigteIds.map(norm));
        audit.state_update = audit.state_update || {};
        audit.state_update.faeden_geschlossen = [...new Set([...(audit.state_update.faeden_geschlossen||[]), ...bestaetigteIds])];
        fadenProbleme = zwingendFaellig.filter(f=>!bestaetigtSet.has(norm(f.id)));
      }
      const schwer = (audit.verstoesse||[]).filter(v=>v.schwere==='hoch');
      if((audit.bestanden || !schwer.length) && !fadenProbleme.length){
        this.log(`K${n} — bestanden${(audit.verstoesse||[]).length?' ('+audit.verstoesse.length+' kleine Hinweise)':''}`,'k'); akzeptiert=true; break;
      }
      // Fäden-Probleme zuerst und mit eigenem, großzügigerem Budget angehen — das
      // ist automatisierbar, weil objektiv prüfbar, ohne dass du das siehst.
      if(fadenProbleme.length && rundenFaeden<MAX_FAEDEN_VERSUCHE){
        rundenFaeden++;
        this.log(`K${n} — ${fadenProbleme.length} Faden(s) noch offen, automatische Nachbesserung ${rundenFaeden}/${MAX_FAEDEN_VERSUCHE} …`,'e');
        text = await API.call({system:p.system, user: basis + P.fadenkorrektur(fadenProbleme, text), temp:0.9, maxTokens:this.tokenBudget(p), timeoutMs:900000, onRetry:m=>this.log(m,'e')});
        Store.saveZwischenstand(p.id, n, {text, runden, rundenFaeden, notizen});
        continue;
      }
      if(!schwer.length && fadenProbleme.length){
        // Fäden-Budget erschöpft, sonst nichts zu beanstanden — erst jetzt an einen
        // Menschen übergeben, nicht schon nach dem ersten Versuch.
        this.log(`K${n} — Faden(s) ${fadenProbleme.map(f=>f.id).join(', ')} bleiben trotz ${MAX_FAEDEN_VERSUCHE} automatischen Versuchen offen. Als „prüfen" markiert.`,'e');
        akzeptiert=false; break;
      }
      if(runden>=max){ this.log(`K${n} — ${schwer.length} schwere Verstöße bleiben. Als „prüfen" markiert.`,'e'); akzeptiert=false; break; }
      runden++;
      this.log(`K${n} — ${schwer.length} schwere Verstöße, Korrekturrunde ${runden}/${max} …`,'e');
      text = await API.call({system:p.system, user: basis + P.korrektur(text, audit.verstoesse), temp:0.9, maxTokens:this.tokenBudget(p), timeoutMs:900000, onRetry:m=>this.log(m,'e')});
      Store.saveZwischenstand(p.id, n, {text, runden, rundenFaeden, notizen});
    }

    if(!opt.ohnePolitur){
      this.log(`K${n} — Stil-Politur …`);
      try{
        let pol;
        try{ pol = await API.call({system:p.system, user:P.politur(p,text), temp:0.8, maxTokens:this.tokenBudget(p), timeoutMs:900000, onRetry:m=>this.log(m,'e')}); }
        catch(e){ if(e.abgeschnitten) pol = e.text; else throw e; }
        if(words(pol) > words(text)*0.6) text = pol;
        else this.log('Politur zu kurz geraten — Entwurf behalten.','e');
      }catch(e){
        // Entwurf + Audit sind bereits gut und geprüft — ein Politur-Fehler darf das
        // nicht wegwerfen. Statt die ganze Kapitel-Erzeugung zu wiederholen (teuer,
        // unnötig), wird einfach ungepoliert weitergemacht.
        this.log('Politur fehlgeschlagen ('+e.message+') — Entwurf ohne Politur behalten, nichts geht verloren.','e');
      }
    }

    const status = akzeptiert ? 'fertig' : 'pruefen';
    const obj = {n, titel:t.titel, body:text.trim(), woerter:words(text),
      status, audit, erzeugt:new Date().toISOString()};
    Store.saveKapitel(p.id,n,obj);
    Store.loescheZwischenstand(p.id,n);
    p.kapitelIdx = p.kapitelIdx.filter(k=>k.n!==n);
    p.kapitelIdx.push({n, titel:t.titel, woerter:obj.woerter, status});
    p.kapitelIdx.sort((a,b)=>a.n-b.n);
    if(audit && audit.state_update && !auditUnlesbar) this.mergeState(p, n, audit.state_update, text);
    else {
      p.state.woerter_gesamt = p.kapitelIdx.reduce((a,k)=>a+(k.woerter||0),0);
      if(auditUnlesbar) this.log(`K${n} — Fäden-/Löschuhr-/Figurenupdate übersprungen, da der Auditor unlesbar war. Erst klären, dann läuft der Tracker weiter sauber.`,'e');
    }
    Store.save(p);
    this.log(`K${n} gespeichert · ${nf(obj.woerter)} Wörter · ${status==='fertig'?'sauber':'prüfen'}`,'k');
    return obj;
  },

  naechstesN(p){
    const alle = p.toc.map(t=>t.n).sort((a,b)=>a-b);
    const da = new Set(p.kapitelIdx.map(k=>k.n));
    for(const n of alle) if(!da.has(n)) return n;
    return null;
  },

  // Liefert die niedrigste Kapitelnummer, die als "prüfen" markiert ist (Audit nicht
  // sauber bestanden oder unlesbare Auditor-Antwort). Solche Kapitel haben oft KEINEN
  // vollständigen state_update erhalten (Fäden, Löschuhr, Sonderzustand, Zusammenfassung
  // können fehlen) — alles danach Geplante baut dann auf einer Lücke auf. Deshalb hält
  // der automatische Lauf hier an, statt stillschweigend weiterzuschreiben.
  ersterOffenerKonflikt(p){
    const offen = p.kapitelIdx.filter(k=>k.status && k.status!=='fertig').map(k=>k.n);
    return offen.length ? Math.min(...offen) : null;
  },

  async lauf(p, anzahl){
    if(this.laeuft) return;
    const konflikt = this.ersterOffenerKonflikt(p);
    if(konflikt!==null){
      App.toast('Kapitel '+konflikt+' ist als „prüfen" markiert — Lauf angehalten, bevor darauf aufgebaut wird.', 1);
      this.log('Automatischer Lauf nicht gestartet: Kapitel '+konflikt+' muss zuerst neu gewürfelt oder als fertig akzeptiert werden.','e');
      App.render();
      return;
    }
    this.laeuft=true; try{Hintergrund.wachhalten()}catch(e){}; this.stop=false; App.render();
    let wake=null;
    try{ if(navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); }catch(e){}
    window.onbeforeunload = ()=> 'Es läuft ein Kapitel.';
    let panne = 0;
    try{
      if(!p.bibel) await this.bibel(p);
      for(let i=0;i<anzahl;i++){
        if(this.stop){ this.log('Gestoppt.','e'); break; }
        const zwischenkonflikt = this.ersterOffenerKonflikt(p);
        if(zwischenkonflikt!==null){
          this.log('Angehalten: Kapitel '+zwischenkonflikt+' ist als „prüfen" markiert. Bitte erst klären.','e');
          App.toast('Angehalten bei Kapitel '+zwischenkonflikt+' — muss erst geklärt werden.',1);
          break;
        }
        const n = this.naechstesN(p);
        if(n===null){ this.log('Alle Kapitel vorhanden.','k'); break; }
        try{
          await this.kapitel(p,n);
          panne = 0;
        }catch(e){
          panne++;
          this.log('Kapitel '+n+' gescheitert: '+e.message,'e');
          if(panne >= 2 || /Key|Workspace|Zugangswort|Guthaben|credit/i.test(e.message)) throw e;
          this.log('Ich versuche es in 10 s noch einmal. Bisheriges bleibt gespeichert.');
          await new Promise(x=>setTimeout(x,10000));
          i--;
        }
        App.render();
      }
    }catch(e){
      this.log('Lauf beendet: '+e.message,'e');
      App.toast(e.message,1);
    }
    if(wake) try{ await wake.release() }catch(e){}
    window.onbeforeunload = null;
    this.laeuft=false; try{Hintergrund.loslassen()}catch(e){}; this.stop=false; App.render();
  }
};

/* ============ UI ============ */
const App = {
  tab:'werk', p:null, leseN:null, edit:false, entwurfModus:false, entwurfGenre:'', entwurfIdee:'', entwurfLaeuft:false,

    // Bake-in: bestehende Installationen ohne engineUrl bekommen Cloud-Defaults
    {
      const cfg = Store.cfg();
      if(!cfg.engineUrl){
        cfg.engineUrl = 'https://buch-engine.lupinzerooo.workers.dev';
        if(!cfg.pass) cfg.pass = '1234';
        Store.saveCfg(cfg);
      }
    }
    if(CloudSync.enabled()){
      try{ await CloudSync.pullAll(); }catch(e){ console.warn('Cloud pull', e); if(typeof App!=='undefined' && App.toast) setTimeout(()=>App.toast('Cloud laden: '+(e.message||e),1), 500); }
    }
    // Prefer shared Fleisch & Thron project after cloud pull
    {
      const wantId = 'isekai-6a9dc73e';
      const liste = Store.list() || [];
      const hit = liste.find(x => x && (x.id === wantId || x.name === 'Fleisch & Thron'));
      if(hit){
        const m = Store.meta();
        m.aktiv = hit.id;
        Store.saveMeta(m);
      }
    }
    let id = Store.aktivId();
    this.p = id ? Store.load(id) : null;
    if(!this.p) this.p = Store.create(NACHBILD);
    // Wo war ich zuletzt? Tab und ggf. offenes Kapitel wiederherstellen, statt
    // nach jedem Neuladen wieder bei "Werk" und der Kapitelliste zu landen.
    this.tab = this.p.letzterTab || 'werk';
    this.leseN = (this.tab==='lesen' && this.p.leseStand) ? this.p.leseStand.n : null;
    document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{this.tab=b.dataset.tab;this.edit=false;this.render();window.scrollTo(0,0)});
    this.render();
    this.hintergrundSync();
    setInterval(()=>this.hintergrundSync(), 20000);
  },

  save(){ Store.save(this.p); },
  toast(msg, bad){
    const el=document.createElement('div'); el.className='toast'+(bad?' bad':''); el.textContent=msg;
    document.body.appendChild(el); setTimeout(()=>el.remove(), bad?4200:2200);
  },
  paintLog(){ const el=document.getElementById('log'); if(!el) return;
    el.innerHTML = Pipe.logs.map(l=>`<span class="${l.cls||''}">${esc(l.zeit)}  ${esc(l.t)}</span>`).join('\n');
    el.scrollTop = el.scrollHeight; },

  render(){
    const p=this.p;
    document.getElementById('brand').innerHTML = `<span class="ds">Roman</span>-Werkstatt`;
    const off=(p.state.offene_faeden||[]).filter(f=>f.status!=='geschlossen').length;
    document.getElementById('projline').textContent = `${p.kapitelIdx.length}/${p.toc.length} Kapitel · ${nf(p.state.woerter_gesamt||0)} W.`;
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===this.tab));
    const v=document.getElementById('view');
    v.innerHTML = this['t_'+this.tab] ? this['t_'+this.tab](p) : '';
    if(this.tab==='werk') this.paintLog();

    // Lese-Stand merken (Tab + offenes Kapitel), damit ein Neuladen/Sitzungsende
    // nicht wieder ganz von vorne beginnt. Nur schreiben, wenn sich wirklich etwas
    // geändert hat — render() läuft während der Generierung sehr oft.
    const neuerStand = (this.tab==='lesen' && this.leseN!==null)
      ? {n:this.leseN, anteil:(p.leseStand && p.leseStand.n===this.leseN) ? p.leseStand.anteil : 0}
      : null;
    const aendertSich = p.letzterTab!==this.tab
      || (!!p.leseStand)!==(!!neuerStand)
      || (p.leseStand && neuerStand && p.leseStand.n!==neuerStand.n);
    if(aendertSich){ p.letzterTab=this.tab; p.leseStand=neuerStand; Store.save(p); }

    // Beim Öffnen eines Kapitels (oder Rückkehr dorthin) zur gemerkten Stelle scrollen.
    if(this.tab==='lesen' && this.leseN!==null && !this.edit && p.leseStand && p.leseStand.n===this.leseN && p.leseStand.anteil>0){
      const ziel = p.leseStand.anteil;
      requestAnimationFrame(()=>{
        const hoehe = document.body.scrollHeight - window.innerHeight;
        if(hoehe>0) window.scrollTo(0, Math.round(ziel*hoehe));
      });
    }
    this.scrollVerfolgen();
  },

  // Verfolgt beim Lesen die Scrollposition (als Anteil der Seitenhöhe, robust
  // gegenüber unterschiedlichen Bildschirmgrößen) und speichert sie gedrosselt —
  // nicht bei jedem Pixel, sondern max. alle 600ms.
  scrollVerfolgen(){
    if(this._scrollHandler){ window.removeEventListener('scroll', this._scrollHandler); this._scrollHandler=null; }
    if(this.tab!=='lesen' || this.leseN===null || this.edit) return;
    let timer=null;
    this._scrollHandler = ()=>{
      if(timer) clearTimeout(timer);
      timer = setTimeout(()=>{
        const hoehe = document.body.scrollHeight - window.innerHeight;
        const anteil = hoehe>0 ? Math.max(0, Math.min(1, window.scrollY/hoehe)) : 0;
        this.p.leseStand = {n:this.leseN, anteil};
        Store.save(this.p);
      }, 600);
    };
    window.addEventListener('scroll', this._scrollHandler, {passive:true});
  },

      ${(()=>{ const kk=p.state.kosten||{tokenEin:0,tokenAus:0}; const c=Store.cfg(); const geschaetzt=(kk.tokenEin/1e6*(c.preisEinProMio||0))+(kk.tokenAus/1e6*(c.preisAusProMio||0));
        return (c.preisEinProMio||c.preisAusProMio) ? `<p class="sub" style="margin:2px 0 0">Dieses Buch insgesamt: geschätzt <b style="color:var(--head)">${geschaetzt.toFixed(2)} €</b></p>` : ''; })()}

        <div class="sub" style="margin-top:4px">${nf(k.woerter)} Wörter</div></div>`; });
    }
    return h;
  },

  t_buch(p){
    const k=p.konzept;
    let h='';
    if(p.verkaufssatz) h+=`<div class="card" style="border-color:var(--deep-d)"><div class="sub">Verkaufssatz</div><p style="margin:6px 0 0;font-family:var(--serif);font-size:17px;color:var(--head)">${esc(p.verkaufssatz)}</p></div>`;
    h+=`<div class="card"><h2>Grunddaten</h2>
      ${k.genre?`<p class="sub" style="margin:-4px 0 10px">Genre: ${esc(k.genre)}</p>`:''}
      <label>Titel</label><input value="${att(k.titel)}" onchange="App.setK('titel',this.value)">
      <label style="margin-top:10px">Untertitel</label><input value="${att(k.untertitel)}" onchange="App.setK('untertitel',this.value)">
      <label style="margin-top:10px">Prämisse in einem Satz</label><textarea onchange="App.setK('praemisse',this.value)">${esc(k.praemisse)}</textarea>
      <label style="margin-top:10px">Schauplatz</label><textarea onchange="App.setK('schauplatz',this.value)">${esc(k.schauplatz)}</textarea>
      <div class="row" style="margin-top:10px">
        <div><label>Zielwörter gesamt</label><input type="number" value="${p.zielWoerter}" onchange="App.setP('zielWoerter',+this.value)"></div>
        <div><label>Wörter pro Kapitel</label><input type="number" value="${p.kapitelZiel}" onchange="App.setP('kapitelZiel',+this.value)"></div>
      </div>
      <p class="sub" style="margin-top:8px">Das Token-Budget für Entwurf/Korrektur/Politur skaliert automatisch mit diesem Wert. Bei deutlich höheren Zielen (4000–5000+ Wörter) dauert ein Kapitel entsprechend länger und kostet mehr — bei kimi-k3 zusätzlich, weil das interne Nachdenken des Modells als Ausgabe mitzählt. Für lange Kapitel ist kimi-k2.6 oft die günstigere Wahl bei kaum schlechterer Qualität.</p>
      </div>`;

    h+=`<div class="card"><h2>${esc(k.regelLabel||'Regeln des Spuks')}</h2><p class="sub">Eine Regel pro Zeile. Der Auditor prüft jedes Kapitel dagegen.</p>
      <label style="margin-top:4px">Überschrift dieses Regelblocks (taucht so in jedem Prompt auf)</label>
      <input value="${att(k.regelLabel||'REGELWERK DES SPUKS')}" onchange="App.setK('regelLabel',this.value)">
      <textarea style="min-height:170px;margin-top:8px" onchange="App.setListe('regeln',this.value)">${esc(k.regeln.join('\n'))}</textarea></div>`;

    h+=`<div class="card"><h2>Figuren</h2><p class="sub">Eine Figur pro Zeile: Name, Alter — Rolle, Fehler, Bogen.</p>
      <textarea style="min-height:170px" onchange="App.setListe('figuren',this.value)">${esc(k.figuren.join('\n'))}</textarea></div>`;

    h+=`<div class="card"><h2>Twists</h2><p class="sub">Eine Wendung pro Zeile. Wird nie vorweggenommen.</p>
      <textarea style="min-height:110px" onchange="App.setListe('twists',this.value)">${esc(k.twists.join('\n'))}</textarea></div>`;

    h+=`<details><summary>System-Prompt (gilt bei jedem Aufruf)</summary>
      <textarea style="min-height:220px;margin-top:8px" onchange="App.setP('system',this.value)">${esc(p.system)}</textarea></details>`;
    h+=`<details><summary>Blacklist</summary>
      <textarea style="min-height:220px;margin-top:8px" onchange="App.setP('blacklist',this.value)">${esc(p.blacklist)}</textarea></details>`;
    if(p.bibel) h+=`<details><summary>Erzeugte Bibel</summary><div class="mono" style="white-space:pre-wrap;margin-top:8px;max-height:300px;overflow:auto">${esc(JSON.stringify(p.bibel,null,1))}</div></details>`;

    h+='<h3>Inhaltsverzeichnis</h3>';
    let teil='';
    p.toc.forEach(t=>{
      if(t.teil!==teil){ teil=t.teil; h+=`<div class="sub" style="margin:14px 0 6px">Teil ${teil}</div>`; }
      const da=p.kapitelIdx.find(k=>k.n===t.n);
      const b=p.outline[t.n];
      h+=`<div class="item"><div class="split">
        <div style="min-width:0"><div class="kap">${t.n===0?'Prolog':t.n}</div>
        <input value="${att(t.titel)}" onchange="App.setToc(${t.n},'titel',this.value)" style="border:none;background:none;padding:2px 0;font-weight:500;color:var(--head)"></div>
        ${da?'<span class="tag ok">geschrieben</span>':b?'<span class="tag on">Beats</span>':'<span class="tag">offen</span>'}</div>
        <textarea style="min-height:56px;margin-top:6px;font-size:13px" onchange="App.setToc(${t.n},'beat',this.value)">${esc(t.beat)}</textarea>`;
      if(b && (b.spannungsquelle||b.sichtbar_fehlende_erinnerung)){
        h+=`<div class="sub" style="margin-top:8px;border-left:2px solid var(--deep-d);padding-left:9px">
          ${b.spannungsquelle?'<div><b>Anspannung:</b> '+esc(b.spannungsquelle)+'</div>':''}
          ${b.sichtbar_fehlende_erinnerung?'<div style="margin-top:3px"><b>Fehlt sichtbar:</b> '+esc(b.sichtbar_fehlende_erinnerung)+'</div>':''}
          ${b.schreckmoment?'<div style="margin-top:3px;color:var(--rost)">Schreckmoment</div>':''}
        </div>`;
      }
      h+='</div>';
    });
    return h;
  },

  t_faeden(p){
    const f=p.state.offene_faeden||[], jetzt=p.kapitelIdx.length;
    const offen=f.filter(x=>x.status!=='geschlossen'), zu=f.filter(x=>x.status==='geschlossen');
    let h=`<div class="card"><h2>Faden-Ampel</h2>
      <p class="sub">${zu.length} von ${f.length} gelöst. Rot heißt: Deadline überschritten, der Auditor hat es durchgelassen.</p>
      <div class="bar"><i style="width:${f.length?zu.length/f.length*100:0}%;background:${zu.length/(f.length||1)<.4?'var(--rost)':'var(--moos)'}"></i></div></div>`;
    if(!f.length) h+='<div class="empty">Noch keine Fäden. Sie entstehen beim Schreiben und werden vom Auditor gepflegt.</div>';
    offen.sort((a,b)=>a.spaetestens_kapitel-b.spaetestens_kapitel).forEach(x=>{
      const rest=x.spaetestens_kapitel-jetzt;
      const cls = rest<0?'bad':rest<=3?'on':'';
      h+=`<div class="item"><div class="split"><span class="mono">${esc(x.id)}</span>
        <span class="tag ${cls}">${rest<0?'überfällig':'noch '+rest+' Kap.'}</span></div>
        <div style="margin-top:6px">${esc(x.versprechen)}</div>
        <div class="sub" style="margin-top:4px">geöffnet in K${x.eroeffnet_in} · spätestens K${x.spaetestens_kapitel}</div>
        <div class="row" style="margin-top:8px">
          <button class="small ghost" onclick="App.fadenDeadline('${esc(x.id)}')">Deadline ändern</button>
          <button class="small ghost" onclick="App.fadenZu('${esc(x.id)}')">Als gelöst markieren</button>
        </div></div>`;
    });
    if(zu.length){ h+='<h3>Gelöst</h3>'; zu.forEach(x=>{
      h+=`<div class="item" style="opacity:.6"><div class="split"><span class="mono">${esc(x.id)}</span><span class="tag ok">K${x.aufgeloest_in}</span></div>
      <div style="margin-top:6px">${esc(x.versprechen)}</div></div>`; }); }

    if((p.state.figuren||[]).length){
      h+='<h3>Was die Figuren wissen</h3>';
      p.state.figuren.forEach(f2=>{
        h+=`<details><summary>${esc(f2.name)} <span class="sub">· ${f2.erinnerungen_geloescht||0} Erinnerungen weg</span></summary>
        <div class="sub" style="margin-top:8px"><b>weiß:</b> ${esc((f2.weiss||[]).join(', ')||'—')}<br>
        <b>weiß nicht:</b> ${esc((f2.weiss_nicht||[]).join(', ')||'—')}<br>
        <b>Ort:</b> ${esc(f2.aufenthaltsort||'—')}<br>
        <b>Zustand:</b> ${esc(f2.koerperlicher_zustand||'—')}</div></details>`;
      });
    }
    return h;
  },

  t_lesen(p){
    if(this.leseN!==null){
      const ch=Store.kapitel(p.id,this.leseN);
      if(!ch){ this.leseN=null; return this.t_lesen(p); }
      if(this.edit){
        return `<div class="card"><label>Titel</label><input id="ed-t" value="${att(ch.titel)}">
          <label style="margin-top:10px">Text</label><textarea id="ed-b" style="min-height:60vh;font-size:15px">${esc(ch.body)}</textarea>
          <div class="row" style="margin-top:12px"><button class="primary" onclick="App.speichereKapitel()">Speichern</button>
          <button class="ghost" onclick="App.edit=false;App.render()">Abbrechen</button></div></div>`;
      }
      const paras=ch.body.split(/\n{2,}|\n/).map(s=>s.trim()).filter(Boolean);
      let h=`<div class="split" style="margin:14px 0"><button class="small ghost" onclick="App.leseN=null;App.render()">Zurück</button>
        <span class="sub">${nf(ch.woerter)} Wörter · ${ch.status==='fertig'?'sauber':'prüfen'}</span></div>`;
      if(ch.audit && (ch.audit.verstoesse||[]).length){
        h+=`<details><summary>${ch.audit.verstoesse.length} Anmerkungen des Auditors</summary><div class="sub" style="margin-top:8px">`;
        ch.audit.verstoesse.forEach(v=>h+=`<div style="margin-bottom:8px"><span class="tag ${v.schwere==='hoch'?'bad':''}">${esc(v.typ)} · ${esc(v.schwere)}</span> ${esc(v.korrekturhinweis)}</div>`);
        h+='</div></details>';
      }
      h+=`<div class="reader"><div class="kap">${ch.n===0?'Prolog':'Kapitel '+ch.n}</div>
        <h2 style="font-size:22px;margin:2px 0 18px">${esc(ch.titel)}</h2>`;
      paras.forEach(t=>{ h += (t==='*'||t==='***') ? '<div class="sep">* * *</div>' : `<p>${esc(t)}</p>`; });
      h+=`</div><div class="row" style="margin:20px 0">
        <button class="ghost small" onclick="App.edit=true;App.render()">Bearbeiten</button>
        <button class="ghost small" onclick="App.wuerfeln(${ch.n})">Neu würfeln</button>
        <button class="ghost small danger" onclick="App.loescheKapitel(${ch.n})">Löschen</button></div>`;
      return h;
    }
    if(!p.kapitelIdx.length) return '<div class="empty">Noch nichts geschrieben. Auf „Werk" das erste Kapitel starten.</div>';
    let h='';
    if(p.leseStand && p.leseStand.anteil>0.02){
      const k = p.kapitelIdx.find(x=>x.n===p.leseStand.n);
      if(k) h+=`<div class="item" style="border-color:var(--deep-d)" onclick="App.leseN=${k.n};App.render()">
        <div class="split"><div><div class="kap">Weiterlesen</div><div class="t">${k.n===0?'Prolog':'Kapitel '+k.n} — ${esc(k.titel)}</div>
        <div class="sub">bei ${Math.round(p.leseStand.anteil*100)} %</div></div></div></div>`;
    }
    p.kapitelIdx.forEach(k=>{
      h+=`<div class="item" onclick="App.leseN=${k.n};App.render()">
        <div class="split"><div><div class="kap">${k.n===0?'Prolog':'Kapitel '+k.n}</div><div class="t">${esc(k.titel)}</div>
        <div class="sub">${nf(k.woerter)} Wörter · ca. ${Math.max(1,Math.round(k.woerter/220))} Min.</div></div>
        <span class="tag ${k.status==='fertig'?'ok':'bad'}">${k.status==='fertig'?'sauber':'prüfen'}</span></div></div>`;
    });
    return h;
  },

  t_setup(p){
    const c=Store.cfg(), liste=Store.list();
    const kk = p.state.kosten || {tokenEin:0, tokenAus:0, aufrufe:0};
    const kostenSchaetzung = (kk.tokenEin/1e6*(c.preisEinProMio||0)) + (kk.tokenAus/1e6*(c.preisAusProMio||0));
    const anbieter = ANBIETER[c.anbieter] || ANBIETER.kimi;
    let h=`<div class="card"><h2>KI-Zugang</h2>
      <label>Anbieter</label>
      <select onchange="App.setAnbieter(this.value)">
        ${Object.keys(ANBIETER).map(k=>`<option value="${k}" ${c.anbieter===k?'selected':''}>${ANBIETER[k].label}</option>`).join('')}
      </select>
      <p class="sub" style="margin:6px 0 12px">Hole dir deinen Key auf <a href="${anbieter.konsole}" target="_blank">${anbieter.konsole.replace('https://','')}</a>.</p>
      <label>API-Key (bleibt nur auf diesem Gerät)</label>
      <input type="password" value="${att(c.key)}" placeholder="sk-…" onchange="App.setCfg('key',this.value.trim())">
      <label style="margin-top:10px">Modell</label>
      <select onchange="App.setCfg('model',this.value)">
        ${anbieter.modelle.map(m=>`<option value="${m.id}" ${c.model===m.id?'selected':''}>${m.id}</option>`).join('')}
      </select>
      <p class="sub" style="margin:6px 0 0">${anbieter.modelle.map(m=>m.label).join(' · ')}</p>
      <label style="margin-top:10px">Korrekturrunden pro Kapitel (allgemeine Verstöße)</label>
      <input type="number" min="0" max="5" value="${c.maxRetry}" onchange="App.setCfg('maxRetry',+this.value)">
      <p class="sub" style="margin:6px 0 0">Fällige Fäden bekommen automatisch bis zu 4 eigene Korrekturversuche, unabhängig davon — das lässt sich objektiv prüfen (Zitat muss im Text stehen), deshalb braucht es hier keine niedrige Hürde.</p>
      <label class="row" style="margin-top:12px;align-items:center;gap:8px">
        <input type="checkbox" ${c.reflexion!==false?'checked':''} onchange="App.setCfg('reflexion',this.checked)" style="width:auto">
        <span>Autoren-Reflexion vor jedem Kapitel</span>
      </label>
      <p class="sub" style="margin:4px 0 0">Das Modell denkt kurz durch, was die Figur wirklich will und wie die zu einfache Lösung aussähe, bevor es schreibt — ein zusätzlicher, aber günstiger Aufruf pro Kapitel.</p>
      <label class="row" style="margin-top:12px;align-items:center;gap:8px">
        <input type="checkbox" ${c.thinkingOff!==false?'checked':''} onchange="App.setCfg('thinkingOff',this.checked)" style="width:auto">
        <span>Thinking aus (empfohlen bei kimi-k2.6)</span>
      </label>
      <p class="sub" style="margin:4px 0 0">Schaltet bei kimi-k2.6 das interne Nachdenken ab. Verhindert leere Antworten und spart Tokens. Bei kimi-k3 nicht möglich (denkt immer).</p>
      </div>`;

    h+=`<div class="card"><h2>Kosten</h2>
      <p class="sub" style="margin-bottom:10px">Die App kennt aktuelle Preise nicht automatisch — Stand auf ${anbieter.preisSeite} prüfen und hier eintragen, dann rechnet sie live mit.</p>
      <div class="row">
        <div><label>€ je 1 Mio. Input-Token</label><input type="number" step="0.01" min="0" value="${c.preisEinProMio||0}" onchange="App.setCfg('preisEinProMio',+this.value)"></div>
        <div><label>€ je 1 Mio. Output-Token</label><input type="number" step="0.01" min="0" value="${c.preisAusProMio||0}" onchange="App.setCfg('preisAusProMio',+this.value)"></div>
      </div>
      <p class="sub" style="margin-top:10px">Dieses Buch bisher: ${nf(kk.aufrufe)} Aufrufe · ${nf(kk.tokenEin)} Token rein, ${nf(kk.tokenAus)} raus${(c.preisEinProMio||c.preisAusProMio)?` · geschätzt <b style="color:var(--head)">${kostenSchaetzung.toFixed(2)} €</b>`:' · Preise eintragen für eine Schätzung'}</p>
      </div>`;

    h+=`<div class="card"><h2>Proxy (Cloudflare Worker)</h2>
      <p class="sub" style="margin-bottom:12px">Die meisten Anbieter blocken Aufrufe direkt aus dem Browser (CORS). Diese App braucht deshalb deinen eigenen kleinen Cloudflare-Worker als Vermittler — er bekommt bei jedem Aufruf mitgeteilt, an welche Adresse er weiterleiten soll (Header „x-sw-target"), muss also beim Anbieterwechsel meist nicht neu deployed werden. Trag hier die Adresse ein, die dir Cloudflare nach dem Deployen zeigt.</p>
      <label>Worker-URL</label>
      <input value="${att(c.proxyUrl)}" placeholder="https://deepseek-proxy-cj6.pages.dev" onchange="App.setCfg('proxyUrl',this.value.trim())">
      <label style="margin-top:10px">Zugangswort (muss zum Worker-Secret SW_PASS passen)</label>
      <input type="password" value="${att(c.pass)}" onchange="App.setCfg('pass',this.value)">
      <label style="margin-top:14px">Hintergrund-Worker / Cloud-Sync (buch-engine)</label>
      <input value="${att(c.engineUrl||'')}" placeholder="https://buch-engine.DEIN-ACCOUNT.workers.dev" onchange="App.setCfg('engineUrl',this.value.trim())">
        <div class="row" style="margin-top:12px">
          <button type="button" class="small" onclick="App.cloudLaden()">Cloud laden</button>
          <button type="button" class="small primary" onclick="App.cloudSpeichern()">In Cloud speichern</button>
          <button type="button" class="small" onclick="App.cloudStatus()">Fortschritt</button>
        </div>
        <p class="sub" id="cloudSyncHint">${CloudSync.enabled()?(CloudSync.lastMsg||'Cloud-Sync aktiv — gemeinsamer Speicher mit Assistent.'):'Worker-URL + Zugangswort setzen, dann Cloud-Sync.'}</p>

      <p class="sub" style="margin:6px 0 0">Damit Kapitel weitergeschrieben werden, wenn das Handy aus ist. Gleicher Pass wie oben.</p>
      <button class="ghost small full" style="margin-top:10px" onclick="App.testKey()">Verbindung testen</button>
      </div>`;

    h+=`<div class="card"><h2>Projekte</h2>`;
    liste.forEach(x=>{ h+=`<div class="item" style="cursor:pointer" onclick="App.wechsle('${x.id}')"><div class="split"><div class="t">${esc(x.name)}${x.id===p.id?' <span class="tag on">aktiv</span>':''}</div>
      <div class="row pack" style="flex:0 0 auto" onclick="event.stopPropagation()">
      ${x.id===p.id?'':'<button class="small ghost" onclick="App.wechsle(\''+x.id+'\')">Öffnen</button>'}
      <button class="small ghost danger" onclick="event.stopPropagation();App.loescheProjekt('${x.id}')">Löschen</button></div></div>
      <p class="sub" style="margin:6px 0 0">${x.id===p.id?'Aktuell geöffnet — Titel unter Buch ändern':'Tippen, um dieses Buch zu öffnen'}</p></div>`; });
    h+=`<button class="primary full" style="margin-top:10px" onclick="App.neuStarten()">Neues Buch entwerfen</button>
      <div class="grid2">
      ${Object.keys(VORLAGEN).map(k=>{
        const v=VORLAGEN[k];
        const hint=(v.genre||'').split(',')[0];
        return '<button class="tile" onclick="App.neuesProjekt(\''+k+'\')">'+esc(v.name)+'<small>'+esc(hint)+'</small></button>';
      }).join('')}
      <button class="tile accent" onclick="App.neuesProjekt(true)">Leeres Buch<small>ohne Vorlage starten</small></button>
      </div>
      <button class="ghost full" style="margin-top:8px" onclick="App.vorlageAktualisieren()">Dieses Projekt auf die aktuelle Vorlage setzen</button>
      <hr><h3 style="margin-top:14px">Gesamte Bibliothek</h3>
      <p class="sub" style="margin-bottom:8px">Sichert oder lädt ALLE Projekte auf einmal — anders als das Manuskript-Backup unten, das nur das aktuell offene Buch betrifft.</p>
      <button class="ghost full" onclick="App.exportBibliothek()">Alle Projekte sichern</button>
      <label style="margin-top:10px">Bibliotheks-Backup einspielen (fügt Projekte hinzu, ersetzt nichts)</label>
      <input type="file" accept=".json" onchange="App.importBibliothek(event)"></div>`;

    h+=`<div class="card"><h2>Manuskript</h2><p class="sub">${p.kapitelIdx.length} Kapitel · ${nf(p.state.woerter_gesamt||0)} Wörter</p>
      <div class="row"><button onclick="App.exportEPUB()">EPUB 3</button><button onclick="App.exportDOCX()">Word (.docx)</button></div>
      <div class="row" style="margin-top:8px"><button class="ghost" onclick="App.exportTXT()">Text</button>
      <button class="ghost" onclick="App.exportJSON()">Backup</button></div>
      <hr><label>Cover</label>
      ${p.cover?`<img src="${p.cover}" alt="Cover" style="display:block;width:150px;border-radius:6px;border:1px solid var(--line);margin:8px auto">
        <button class="ghost small full" onclick="App.coverWeg()">Cover entfernen</button>`
        :'<p class="sub" style="margin:4px 0 8px">Kein Cover. Wird ins EPUB eingebettet und als erste Seite angezeigt. KDP will 1600×2560 px.</p>'}
      <input type="file" accept="image/*" onchange="App.coverWaehlen(event)">
      <label style="margin-top:14px">Autor (für Export)</label><input value="${att(p.autor)}" onchange="App.setP('autor',this.value)">
      <label style="margin-top:10px">ISBN (optional)</label><input value="${att(p.isbn)}" onchange="App.setP('isbn',this.value)">
      <hr><label>Backup einspielen</label><input type="file" accept=".json" onchange="App.importJSON(event)"></div>`;

    if(p.kdp) h+=`<div class="card"><h2>KDP-Paket</h2><div style="white-space:pre-wrap;font-size:14px">${esc(p.kdp)}</div>
      <button class="ghost full" style="margin-top:10px" onclick="App.kdp()">Neu erzeugen</button></div>`;
    else h+=`<div class="card"><h2>KDP-Paket</h2><p class="sub">Klappentext, Keywords, Kategorien, Coverbriefing — sinnvoll, wenn das Manuskript steht.</p>
      <button class="ghost full" onclick="App.kdp()">Jetzt erzeugen</button></div>`;

    let belegt=0; try{ for(const k in MEM) if(k.startsWith('sw:')) belegt += JSON.stringify(MEM[k]||'').length; }catch(e){}
    h+=`<p class="sub" style="margin:20px 0 0">Speicher: ${Math.round(belegt/1024)} KB (liegt in IndexedDB, deutlich mehr Platz als der frühere 5-MB-Deckel von localStorage — aber auch das ist nicht unbegrenzt).${belegt>50_000_000?' <b style="color:var(--rost)">Wird groß — Backup ziehen und alte Projekte löschen.</b>':''}</p>`;
    h+=`<p class="sub" style="margin:6px 0 30px">Alles liegt in diesem Browser. Backup regelmäßig exportieren — ein geleerter Browserspeicher nimmt das Buch mit.</p>`;
    return h;
  }
};

/* ============ AKTIONEN ============ */
Object.assign(App, {
  setK(k,v){ this.p.konzept[k]=v; if(k==='titel') this.p.name=v; this.save(); this.render(); },
  setP(k,v){ this.p[k]=v; this.save(); if(k==='autor'||k==='isbn'||k==='system'||k==='blacklist') return; this.render(); },
  setListe(k,v){ this.p.konzept[k]=v.split('\n').map(s=>s.trim()).filter(Boolean); this.save(); },
