<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worker-Test</title>
<style>
  body{font-family:-apple-system,sans-serif;background:#0d1117;color:#eee;padding:16px;}
  input,button,textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #444;background:#161b22;color:#eee;font-size:16px;}
  button{background:#2563eb;border:none;font-weight:600;}
  pre{background:#000;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:13px;max-height:300px;overflow:auto;}
  label{font-size:13px;color:#999;margin-top:10px;display:block;}
</style>
</head>
<body>
<h2>Worker-Test (Etappe 1)</h2>

<label>Worker-URL (deine neue, z.B. https://buch-engine.DEINNAME.workers.dev)</label>
<input id="url" placeholder="https://buch-engine.xxx.workers.dev">

<label>Zugangswort (SW_PASS)</label>
<input id="pass" type="password">

<label>Job-ID (frei wählbar, z.B. test1)</label>
<input id="jobId" value="test1">

<button onclick="starten()">Auftrag starten (Bibel-Test)</button>
<button onclick="status()">Status abfragen</button>

<pre id="out">Bereit.</pre>

<script>
function basis(){ return document.getElementById('url').value.replace(/\/+$/,''); }
function pass(){ return document.getElementById('pass').value; }
function jobId(){ return document.getElementById('jobId').value; }
function zeige(x){ document.getElementById('out').textContent = typeof x==='string'?x:JSON.stringify(x,null,2); }

async function starten(){
  zeige('Sende Auftrag …');
  try{
    const r = await fetch(basis()+'/start', {
      method:'POST',
      headers:{'content-type':'application/json','x-sw-pass':pass()},
      body: JSON.stringify({
        jobId: jobId(),
        typ: 'bibel',
        model: 'kimi-k2.6',
        maxTokens: 4000,
        system: 'Du antwortest ausschließlich mit gültigem JSON.',
        user: 'Erzeuge ein Test-JSON-Objekt mit Schema: {"nachricht":"", "zahl":0}. Setze nachricht auf "Hintergrund-Test erfolgreich" und zahl auf 42.'
      })
    });
    zeige(await r.json());
  }catch(e){ zeige('Fehler: '+e.message); }
}

async function status(){
  zeige('Frage Status ab …');
  try{
    const r = await fetch(basis()+'/status?jobId='+encodeURIComponent(jobId()), {
      headers:{'x-sw-pass':pass()}
    });
    zeige(await r.json());
  }catch(e){ zeige('Fehler: '+e.message); }
}
</script>
</body>
</html>
